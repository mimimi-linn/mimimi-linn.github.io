<!DOCTYPE html>
<html lang="zh-CN">

<meta charset="UTF-8">

<title>📰 新闻</title>
<style>
/* ============================================
   新闻页 - 薄荷绿 × 中国红点缀
   ============================================ */
:root {
  --mint: #6B9AC4;
  --mint-light: #EBF2F8;
  --mint-lighter: #FAFAFA;
  --red: #D45555;
  --red-light: #FAEBEB;
  --green: #27AE60;
  --green-light: #E8F5E9;
  --choco: #3D3D3D;
  --choco-light: #8A8A8A;
  --choco-hint: #B0B0B0;
  --border: #E8E8E8;
  --white: #FFFFFF;
  --shadow: 0 2px 12px rgba(107, 154, 196, 0.10);
  --shadow-float: 0 4px 20px rgba(107, 154, 196, 0.15);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  background: var(--mint-lighter);
  color: var(--choco);
  min-height: 100vh;
  max-width: 430px;
  margin: 0 auto;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 140px;
  padding-left: 104px;
}

/* --- 顶部导航栏 --- */
.header {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; padding: 0 16px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
}
.header-back {
  width: 36px; height: 36px; border: none; border-radius: 50%;
  background: var(--mint-light); display: flex; align-items: center; justify-content: center;
  text-decoration: none; color: var(--choco); font-size: 18px; flex-shrink: 0;
}
.header-back:active { transform: scale(0.92); }
.header-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; color: var(--choco); }
.header-drawer {
  width: 36px; height: 36px; border: none; border-radius: 50%;
  background: var(--mint); display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.header-drawer:active { transform: scale(0.92); }
.header-drawer span { display: block; width: 14px; height: 2px; background: var(--white); border-radius: 1px; margin: 1.5px 0; }

/* --- 主体内容 --- */
.main { padding: 16px 16px 0; }

/* --- 通用标题 --- */
.section-title {
  font-size: 15px; font-weight: 600; color: var(--choco);
  margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  padding: 0 4px;
}
.section-title .emoji { font-size: 18px; }

/* ============================================
   第1块：新闻联播核心板块
   ============================================ */
.xwlb-card {
  background: var(--white);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}

/* 日期选择器 */
.date-selector {
  display: flex; gap: 8px;
  overflow-x: auto;
  padding: 2px 0 10px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  margin-bottom: 12px;
}
.date-selector::-webkit-scrollbar { display: none; }
.date-btn {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--white);
  font-size: 12px; font-weight: 600;
  color: var(--choco-light);
  cursor: pointer; transition: all 0.2s;
  font-family: inherit;
}
.date-btn.active {
  background: var(--mint); color: var(--white);
  border-color: var(--mint);
}
.date-btn:active { transform: scale(0.95); }

/* 文稿浏览区 */
.transcript-area {
  background: var(--mint-lighter);
  border-radius: 14px;
  padding: 14px;
  max-height: 320px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  margin-bottom: 12px;
}
.transcript-area::-webkit-scrollbar { width: 3px; }
.transcript-area::-webkit-scrollbar-thumb { background: var(--mint); border-radius: 2px; }
.transcript-date {
  font-size: 13px; font-weight: 700; color: var(--mint);
  margin-bottom: 10px; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.transcript-item {
  display: flex; gap: 8px;
  margin-bottom: 10px;
  font-size: 13px; line-height: 1.6; color: var(--choco);
}
.transcript-item:last-child { margin-bottom: 0; }
.transcript-num {
  flex-shrink: 0;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--mint-light); color: var(--mint);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; margin-top: 1px;
}
.transcript-text { flex: 1; }

/* AI总结按钮 */
.ai-summary-btn {
  width: 100%; height: 44px;
  border: none; border-radius: 14px;
  background: linear-gradient(135deg, var(--green), #2ECC71);
  color: var(--white);
  font-size: 14px; font-weight: 600;
  cursor: pointer; transition: transform 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  font-family: inherit;
  box-shadow: 0 2px 8px rgba(39, 174, 96, 0.25);
}
.ai-summary-btn:active { transform: scale(0.97); }
.ai-summary-btn.loading { background: var(--green-light); color: var(--green); }

/* AI总结结果 */
.ai-summary-result {
  display: none;
  margin-top: 12px;
  padding: 14px;
  background: linear-gradient(135deg, var(--green-light), #F0FBF3);
  border-radius: 14px;
  border: 1px solid #C8E6C9;
}
.ai-summary-result.show { display: block; animation: fadeIn 0.4s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.ai-summary-title {
  font-size: 13px; font-weight: 700; color: var(--green);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 6px;
}
.ai-summary-category {
  margin-bottom: 10px;
}
.ai-summary-category:last-child { margin-bottom: 0; }
.ai-cat-name {
  font-size: 11px; font-weight: 700; color: var(--choco);
  margin-bottom: 4px;
  display: flex; align-items: center; gap: 4px;
}
.ai-cat-list {
  list-style: none;
}
.ai-cat-list li {
  font-size: 12px; color: var(--choco-light);
  line-height: 1.6; padding-left: 12px; position: relative;
}
.ai-cat-list li::before {
  content: ''; width: 4px; height: 4px; border-radius: 50%;
  background: var(--green); position: absolute; left: 0; top: 8px;
}

/* ============================================
   第2块：资讯信息流
   ============================================ */
.news-stream-card {
  background: var(--white);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.news-tabs {
  display: flex;
  background: #F5F5F7;
  border-radius: 12px;
  padding: 3px;
  margin-bottom: 14px;
}
.news-tab {
  flex: 1;
  padding: 8px 0;
  border: none; border-radius: 10px;
  background: transparent;
  font-size: 13px; font-weight: 600;
  color: var(--choco-light);
  cursor: pointer; transition: all 0.2s;
  font-family: inherit;
}
.news-tab.active {
  background: var(--white);
  color: var(--choco);
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.news-tab:active { transform: scale(0.97); }

.news-list { display: flex; flex-direction: column; gap: 10px; }
.news-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px;
  background: var(--mint-lighter);
  border-radius: 14px;
  cursor: pointer; transition: all 0.2s;
  position: relative;
}
.news-item:active { transform: scale(0.98); }
.news-emoji {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--mint-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.news-body { flex: 1; min-width: 0; }
.news-title {
  font-size: 13px; font-weight: 600; color: var(--choco);
  line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
  margin-bottom: 4px;
}
.news-meta {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px; color: var(--choco-hint);
}
.news-star {
  width: 32px; height: 32px; border-radius: 50%;
  border: none; background: transparent;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0; cursor: pointer;
  transition: transform 0.2s; color: var(--choco-hint);
}
.news-star:active { transform: scale(0.85); }
.news-star.starred { color: var(--mint); }

/* ============================================
   第3块：资讯收藏
   ============================================ */
.fav-card {
  background: var(--white);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.fav-list { display: flex; flex-direction: column; gap: 8px; }
.fav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px;
  background: var(--mint-lighter);
  border-radius: 12px;
  cursor: pointer; transition: all 0.2s;
}
.fav-item:active { transform: scale(0.98); }
.fav-emoji { font-size: 16px; flex-shrink: 0; }
.fav-title { font-size: 12px; font-weight: 500; color: var(--choco); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fav-time { font-size: 10px; color: var(--choco-hint); flex-shrink: 0; }

/* --- 底部操作栏 --- */
.footer {
  position: fixed; bottom: 56px; left: 104px; right: 0; width: auto; max-width: calc(430px - 104px);
  display: flex; gap: 12px;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  z-index: 50;
}
.btn-primary {
  flex: 2; height: 48px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, var(--mint), #8AB5D6); color: var(--white);
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform 0.15s; font-family: inherit;
}
.btn-primary:active { transform: scale(0.97); }
.btn-primary.checked { background: var(--mint-light); color: var(--choco); border: 1.5px solid var(--mint); }
.btn-secondary {
  flex: 1; height: 48px; border: 1.5px solid var(--mint); border-radius: 14px;
  background: var(--white); color: var(--choco);
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all 0.2s; font-family: inherit;
}
.btn-secondary:active { background: var(--mint-light); transform: scale(0.97); }

/* --- Toast --- */
.toast {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: rgba(61, 61, 61, 0.92); color: #fff;
  padding: 14px 22px; border-radius: 14px;
  font-size: 13px; font-weight: 500;
  z-index: 999; opacity: 0; visibility: hidden;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
}
.toast.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

/* ===== 底部导航栏 ===== */
.bottom-nav { position: fixed; bottom: 0; left: 104px; right: 0; width: auto; max-width: calc(430px - 104px); display: flex; background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid #E8E8E8; z-index: 200; padding-bottom: env(safe-area-inset-bottom, 0); }
.nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 8px 0 10px; cursor: pointer; background: none; border: none; transition: all 0.2s; font-family: inherit; }
.nav-tab:active { transform: scale(0.92); }
.nav-tab svg { width: 24px; height: 24px; color: #B0B0B0; transition: color 0.2s; }
.nav-tab .nav-tab-label { font-size: 11px; color: #B0B0B0; font-weight: 500; transition: color 0.2s; }
.nav-tab.active svg { color: var(--mint); }
.nav-tab.active .nav-tab-label { color: var(--mint); font-weight: 600; }

/* ===== 左侧固定侧边栏 ===== */
.sidebar { position: fixed; top: 0; left: 0; width: 104px; height: 100vh; background: #F5F5F7; z-index: 250; display: flex; flex-direction: column; border-right: 1px solid #E8E8E8; }
.sidebar-header { padding: 14px 10px 10px; border-bottom: 1px solid #ECECEC; flex-shrink: 0; }
.sidebar-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #6B9AC4 0%, #8AB5D6 100%); margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.sidebar-name { font-size: 16px; font-weight: 700; color: #3D3D3D; line-height: 1.3; text-align: center; }
.sidebar-menu { flex: 1; overflow-y: auto; padding: 6px 0; -webkit-overflow-scrolling: touch; }
.sidebar-menu::-webkit-scrollbar { display: none; }
.sidebar-item { display: flex; flex-direction: row; align-items: center; gap: 8px; padding: 9px 10px; cursor: pointer; text-decoration: none; color: #8A8A8A; transition: all 0.2s; margin: 2px 6px; border-radius: 10px; }
.sidebar-item:active { transform: scale(0.95); }
.sidebar-item .sb-icon { font-size: 20px; line-height: 1; flex-shrink: 0; }
.sidebar-item .sb-label { font-size: 15px; font-weight: 600; line-height: 1.2; }
.sidebar-item.active { background: rgba(107, 154, 196, 0.15); color: #6B9AC4; }
.sidebar-item.active .sb-label { font-weight: 700; }
</style>

/* ============================================
   AI一键总结 - 本地提取式摘要算法
   按关键词分类 + 提取核心要点
   ============================================ */
var categoryKeywords = {
  '🏛️ 时政要闻': ['习近平', '中央', '国务院', '总理', '主席', '会议', '常委', '人大', '政协', '总统', '访问', '签署', '命令', '通令'],
  '⚔️ 军事国防': ['军委', '军队', '部队', '军事', '国防', '军旗', '战机', '武警', '民兵', '记功'],
  '💰 经济财经': ['经济', '出口', '外贸', '投资', '财政', 'GDP', '增长', '贸易', '关税', '产业', '新三样', '充电', '票房', '自贸'],
  '🌍 国际动态': ['俄', '乌', '美国', '日本', '德国', '巴西', '联合国', '以军', '巴勒斯坦', '瑞士', '国际', '地震', '坠毁', '关税'],
  '📋 民生社会': ['防汛', '汛情', '灾后', '旅游', '退役军人', '公安', '网络暴力', '人工智能', '安全', '民政']
};

function generateAISummary() {
  var data = xwlbData[currentDateKey];
  if(!data.items || data.items.length === 0) return;

  var categorized = {};
  for(var cat in categoryKeywords) { categorized[cat] = []; }

  data.items.forEach(function(item) {
    var matched = false;
    for(var cat in categoryKeywords) {
      var keywords = categoryKeywords[cat];
      for(var i = 0; i < keywords.length; i++) {
        if(item.indexOf(keywords[i]) !== -1) {
          /* 提取核心短语：取关键词前后文 */
          var shortText = extractKeyPhrase(item, keywords[i]);
          if(categorized[cat].indexOf(shortText) === -1) {
            categorized[cat].push(shortText);
          }
          matched = true;
          break;
        }
      }
      if(matched) break;
    }
    if(!matched) {
      if(categorized['📋 民生社会'].indexOf(item) === -1) {
        categorized['📋 民生社会'].push(item.length > 40 ? item.substring(0, 40) + '...' : item);
      }
    }
  });

  var html = '<div class="ai-summary-title">🤖 AI结构化要点总结</div>';
  for(var cat in categorized) {
    if(categorized[cat].length === 0) continue;
    html += '<div class="ai-summary-category">';
    html += '<div class="ai-cat-name">' + cat + '（' + categorized[cat].length + '条）</div>';
    html += '<ul class="ai-cat-list">';
    categorized[cat].forEach(function(text) {
      html += '<li>' + text + '</li>';
    });
    html += '</ul>';
    html += '</div>';
  }
  html += '<div style="font-size:10px;color:#B0B0B0;margin-top:10px;text-align:right;">基于关键词提取算法 · 仅供参考</div>';

  var result = document.getElementById('aiSummaryResult');
  result.innerHTML = html;
  result.classList.add('show');
}

function extractKeyPhrase(text, keyword) {
  var idx = text.indexOf(keyword);
  if(idx === -1) return text.length > 35 ? text.substring(0, 35) + '...' : text;
  var start = Math.max(0, idx - 5);
  var end = Math.min(text.length, idx + keyword.length + 20);
  var phrase = text.substring(start, end);
  if(start > 0) phrase = '...' + phrase;
  if(end < text.length) phrase = phrase + '...';
  return phrase;
}

document.getElementById('aiSummaryBtn').addEventListener('click', function() {
  var btn = this;
  btn.classList.add('loading');
  btn.innerHTML = '<span>⏳</span> 正在分析生成...';
  setTimeout(function() {
    generateAISummary();
    btn.classList.remove('loading');
    btn.innerHTML = '<span>🤖</span> AI一键总结要点';
    showToast('AI总结已生成 ✨');
  }, 800);
});

/* ============================================
   资讯信息流 - 东方财富接口（JSONP）
   按关键词分类过滤国内政策/国际新闻
   ============================================ */
var domesticKeywords = ['国务院', '政策', '改革', '法规', '发改委', '央行', '财政部', '全国', '人大', '政协', '法律', '制度', '主席', '总理', '部委', '监管', '规划', '纲要', '意见', '通知', '办法', '条例', '实施', '部署', '会议', '指示', '批示'];
var internationalKeywords = ['美国', '日本', '俄罗斯', '欧盟', '联合国', '国际', '外交', '巴勒斯坦', '乌克兰', '德国', '法国', '英国', '韩国', '朝鲜', '印度', '巴西', '以色列', '伊朗', '北约', '东盟', '非洲', '欧洲', '亚洲', '特朗普', '拜登', '首相', '总统', '制裁', '关税', '谈判', '峰会', 'G7', 'G20', 'APEC'];

var allStreamData = { domestic: [], international: [] };

function fetchStreamNews() {
  /* 东方财富接口固定写入全局变量 ajaxResult，不支持自定义回调名 */
  var oldScript = document.querySelector('#streamScript');
  if(oldScript) oldScript.parentNode.removeChild(oldScript);

  /* 先清除旧数据 */
  window.ajaxResult = null;

  var script = document.createElement('script');
  script.id = 'streamScript';
  script.src = 'https://newsapi.eastmoney.com/kuaixun/v1/getlist_101_ajaxResult_50_1_.html';
  script.onerror = function() {
    document.getElementById('newsList').innerHTML = '<div style="text-align:center;padding:20px;color:#B0B0B0;font-size:13px;">资讯获取失败，请稍后刷新重试</div>';
  };
  document.head.appendChild(script);

  /* 轮询等待 ajaxResult 被赋值 */
  var attempts = 0;
  var timer = setInterval(function() {
    attempts++;
    if(window.ajaxResult && window.ajaxResult.LivesList) {
      clearInterval(timer);
      processStreamData(window.ajaxResult);
      if(script.parentNode) script.parentNode.removeChild(script);
    } else if(attempts > 15) {
      clearInterval(timer);
      document.getElementById('newsList').innerHTML = '<div style="text-align:center;padding:20px;color:#B0B0B0;font-size:13px;">资讯加载超时，请稍后刷新重试</div>';
      if(script.parentNode) script.parentNode.removeChild(script);
    }
  }, 200);
}

function processStreamData(data) {
  if(!data || !data.LivesList) return;
  var domestic = [];
  var international = [];
  data.LivesList.forEach(function(item) {
    var text = (item.title || '') + (item.digest || '');
    var emoji = '📰';
    var isDomestic = false;
    var isInternational = false;

    for(var i = 0; i < domesticKeywords.length; i++) {
      if(text.indexOf(domesticKeywords[i]) !== -1) { isDomestic = true; break; }
    }
    for(var j = 0; j < internationalKeywords.length; j++) {
      if(text.indexOf(internationalKeywords[j]) !== -1) { isInternational = true; break; }
    }

    if(isInternational) emoji = '🌍';
    else if(isDomestic) emoji = '🏛️';

    var newsItem = {
      id: item.newsid || item.id,
      emoji: emoji,
      title: item.title,
      source: '东方财富',
      time: item.showtime || '',
      url: item.url_m || item.url_w || ''
    };

    if(isDomestic) domestic.push(newsItem);
    if(isInternational) international.push(newsItem);
  });

  allStreamData.domestic = domestic.slice(0, 30);
  allStreamData.international = international.slice(0, 30);
  renderStream('domestic');
}

function renderStream(type) {
  var list = document.getElementById('newsList');
  var data = allStreamData[type] || [];
  if(data.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:20px;color:#B0B0B0;font-size:13px;">暂无相关资讯</div>';
    return;
  }
  list.innerHTML = '';
  data.forEach(function(item) {
    var div = document.createElement('div');
    div.className = 'news-item';
    div.setAttribute('data-id', item.id);
    if(item.url) div.setAttribute('data-url', item.url);
    var isFav = isNewsFav(item.id);
    var timeStr = item.time || '';
    div.innerHTML = '<div class="news-emoji">' + item.emoji + '</div>' +
      '<div class="news-body"><div class="news-title">' + item.title + '</div>' +
      '<div class="news-meta"><span>' + item.source + '</span><span>·</span><span>' + timeStr + '</span></div></div>' +
      '<button class="news-star ' + (isFav ? 'starred' : '') + '">' + (isFav ? '★' : '☆') + '</button>';
    list.appendChild(div);
  });
}

/* 事件委托：点击新闻 */
document.getElementById('newsList').addEventListener('click', function(e) {
  if(e.target.closest('.news-star')) return;
  var item = e.target.closest('.news-item');

  var url = item.getAttribute('data-url');

});

/* 事件委托：收藏 */
document.getElementById('newsList').addEventListener('click', function(e) {
  var star = e.target.closest('.news-star');
  if(!star) return;
  e.stopPropagation();
  var item = star.closest('.news-item');
  var id = item.getAttribute('data-id');
  var title = item.querySelector('.news-title').textContent;
  var emoji = item.querySelector('.news-emoji').textContent;
  var time = item.querySelector('.news-meta').lastElementChild.textContent;

  toggleNewsFav(id, title, emoji, time);
  var isFav = isNewsFav(id);
  star.classList.toggle('starred', isFav);
  star.textContent = isFav ? '★' : '☆';
  showToast(isFav ? '已收藏 ⭐' : '已取消收藏');
  renderFavList();
});

document.querySelectorAll('.news-tab').forEach(function(tab) {
  tab.addEventListener('click', function() {
    document.querySelectorAll('.news-tab').forEach(function(t) { t.classList.remove('active'); });
    tab.classList.add('active');
    renderStream(tab.getAttribute('data-stream'));
  });
});

/* ============================================
   资讯收藏逻辑（localStorage）
   ============================================ */
function getFavNews() {
  try { return JSON.parse(localStorage.getItem('news_fav') || '[]'); }
  catch(e) { return []; }
}
function isNewsFav(id) {
  return getFavNews().some(function(item) { return item.id === id; });
}
function toggleNewsFav(id, title, emoji, time) {
  var favs = getFavNews();
  var idx = favs.findIndex(function(item) { return item.id === id; });
  if(idx === -1) {
    favs.unshift({ id: id, title: title, emoji: emoji, time: time });
  } else {
    favs.splice(idx, 1);
  }
  localStorage.setItem('news_fav', JSON.stringify(favs));
}
function renderFavList() {
  var favs = getFavNews();
  var list = document.getElementById('favList');
  if(favs.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:16px;color:#B0B0B0;font-size:13px;">暂无收藏<br>点击资讯右侧☆收藏</div>';
    return;
  }
  list.innerHTML = '';
  favs.forEach(function(item) {
    var div = document.createElement('div');
    div.className = 'fav-item';
    div.innerHTML = '<span class="fav-emoji">' + (item.emoji || '📰') + '</span>' +
      '<span class="fav-title">' + item.title + '</span>' +
      '<span class="fav-time">' + (item.time || '') + '</span>';
    list.appendChild(div);
  });
}

/* ============================================
   打卡逻辑
   ============================================ */
function getTodayKey(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function getCheckinRecords(){try{var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');return d[getTodayKey()]||[]}catch(e){return[]}}
function isChecked(id){return getCheckinRecords().indexOf(id)!==-1}
function submitCheckin(id){var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');var t=getTodayKey();if(!d[t])d[t]=[];if(d[t].indexOf(id)===-1){d[t].push(id);localStorage.setItem('checkin_records',JSON.stringify(d))}updateCheckinButton(true);showToast('打卡成功 📰')}
function updateCheckinButton(checked){var b=document.getElementById('checkinBtn');if(!b)return;if(checked){b.classList.add('checked');b.textContent='✓ 已完成打卡'}else{b.classList.remove('checked');b.textContent='打卡提交'}}

/* Toast */
function showToast(msg){var e=document.getElementById('appToast');if(e)e.remove();var t=document.createElement('div');t.className='toast';t.id='appToast';t.textContent=msg;document.body.appendChild(t);requestAnimationFrame(function(){t.classList.add('show')});setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove()},300)},1500)}

/* ============================================
   初始化
   ============================================ */
document.addEventListener('DOMContentLoaded', function() {
  renderDateSelector();
  renderTranscript();
  fetchStreamNews();
  renderFavList();
  updateCheckinButton(isChecked(10));

  var checkinBtn = document.getElementById('checkinBtn');
  var saveBtn = document.getElementById('saveBtn');

  if(checkinBtn) checkinBtn.addEventListener('click', function(e) {
    e.preventDefault(); e.stopPropagation();
    if(!isChecked(10)) { submitCheckin(10); }
    else { showToast('今日已打卡 📰'); }
  });

  if(saveBtn) saveBtn.addEventListener('click', function(e) {
    e.preventDefault(); e.stopPropagation();
    showToast('记录已保存');
  });
});
