<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏃 运动</title>
<meta name="theme-color" content="#6B9AC4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
/* ============================================
   运动页 - 薄荷绿 × 天空蓝
   ============================================ */
:root {
  --mint: #6B9AC4;
  --mint-light: #EBF2F8;
  --mint-lighter: #FAFAFA;
  --choco: #3D3D3D;
  --choco-light: #8A8A8A;
  --choco-hint: #B0B0B0;
  --blue: #6B9AC4;
  --blue-light: #EBF2F8;
  --blue-soft: #EBF2F8;
  --border: #E8E8E8;
  --white: #FFFFFF;
  --shadow: 0 2px 12px rgba(107, 154, 196, 0.10);
  --shadow-float: 0 4px 20px rgba(91, 155, 213, 0.15);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  background: #F5FAFC;
  color: var(--choco);
  min-height: 100vh;
  max-width: 430px;
  margin: 0 auto;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 140px;
 padding-left: 104px; }

/* --- 顶部导航栏 --- */
.header {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; padding: 0 16px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
}
.header-back {
  width: 36px; height: 36px; border: none; border-radius: 50%;
  background: var(--mint-light); display: flex; align-items: center; justify-content: center;
  text-decoration: none; color: var(--choco); font-size: 18px; flex-shrink: 0;
}
.header-back:active { transform: scale(0.92); }
.header-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; color: var(--choco); }
.header-drawer {
  width: 36px; height: 36px; border: none; border-radius: 50%;
  background: var(--mint); display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.header-drawer:active { transform: scale(0.92); }
.header-drawer span { display: block; width: 14px; height: 2px; background: var(--white); border-radius: 1px; margin: 1.5px 0; }

/* --- 主体内容 --- */
.main { padding: 16px 16px 0; }

/* ============================================
   第1块：进度统计大卡片
   ============================================ */
.progress-card {
  background: linear-gradient(135deg, #6B9AC4 0%, #6CB4F5 100%);
  border-radius: 20px;
  padding: 24px 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-float);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.progress-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-num {
  font-size: 56px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -2px;
  font-variant-numeric: tabular-nums;
}
.progress-num-label {
  font-size: 12px;
  font-weight: 500;
  opacity: 0.85;
  margin-top: 4px;
}
.progress-right {
  flex: 1;
  min-width: 0;
}
.progress-right-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 8px;
  opacity: 0.95;
}
.progress-bar-wrap {
  height: 6px;
  background: rgba(255,255,255,0.25);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 8px;
}
.progress-bar-fill {
  height: 100%;
  background: var(--white);
  border-radius: 3px;
  transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.progress-ratio {
  font-size: 13px;
  font-weight: 600;
  text-align: right;
  opacity: 0.9;
}

/* 数字滚动动画 */
@keyframes countUp {
  from { transform: translateY(40%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.progress-num.animate { animation: countUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

/* ============================================
   第2块：晨间仪式打卡清单
   ============================================ */
.section-title {
  font-size: 15px; font-weight: 600; color: var(--choco);
  margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  padding: 0 4px;
}
.section-title .emoji { font-size: 18px; }

.morning-card {
  background: var(--white);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.morning-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.morning-header-title {
  font-size: 15px; font-weight: 600; color: var(--choco);
  display: flex; align-items: center; gap: 8px;
}
.morning-header-count {
  font-size: 13px; color: var(--mint);
  font-weight: 600;
}

.morning-item {
  display: flex; align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.morning-item:last-child { border-bottom: none; }
.morning-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--blue-soft);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.morning-body { flex: 1; min-width: 0; }
.morning-name { font-size: 14px; font-weight: 600; color: var(--choco); margin-bottom: 2px; }
.morning-desc { font-size: 11px; color: var(--choco-hint); }
.morning-action { flex-shrink: 0; }
.morning-time-input {
  width: 70px; height: 32px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  text-align: center;
  font-size: 13px; font-weight: 600;
  color: var(--choco);
  background: var(--white);
  font-family: inherit;
  outline: none;
}
.morning-time-input:focus { border-color: var(--mint); }
.morning-check {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--mint);
  background: var(--white);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: all 0.25s ease;
  font-size: 13px; color: transparent;
}
.morning-check:active { transform: scale(0.9); }
.morning-check.done {
  background: var(--mint);
  border-color: var(--mint);
  color: var(--white);
}

/* ============================================
   第3块：运动内容（两级标签 + 课程打卡）
   ============================================ */
.exercise-card {
  background: var(--white);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}

/* 一级标签 */
.tag-row-1 {
  display: flex; gap: 10px; margin-bottom: 14px;
}
.tag-l1 {
  flex: 1; text-align: center;
  padding: 10px 4px;
  border-radius: 14px;
  border: 1.5px solid var(--border);
  background: var(--white);
  font-size: 14px; font-weight: 600; color: var(--choco);
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
  gap: 4px;
}
.tag-l1:active { transform: scale(0.96); }
.tag-l1.active {
  background: var(--mint-light);
  border-color: var(--mint);
  color: var(--choco);
}

/* 二级标签 */
.tag-row-2 {
  display: flex; gap: 8px; margin-bottom: 16px;
  flex-wrap: wrap;
}
.tag-l2 {
  padding: 7px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--white);
  font-size: 12px; font-weight: 500; color: var(--choco-light);
  cursor: pointer; transition: all 0.2s;
}
.tag-l2:active { transform: scale(0.96); }
.tag-l2.active {
  background: var(--mint-light);
  border-color: var(--mint);
  color: var(--choco);
  font-weight: 600;
}

/* 课程打卡列表 */
.course-list {
  display: flex; flex-direction: column; gap: 10px;
}
.course-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px;
  background: var(--mint-lighter);
  border-radius: 14px;
  transition: all 0.2s;
}
.course-check {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--mint);
  background: var(--white);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: all 0.25s ease;
  font-size: 12px; color: transparent;
}
.course-check:active { transform: scale(0.9); }
.course-check.done {
  background: var(--mint);
  border-color: var(--mint);
  color: var(--white);
}
.course-body { flex: 1; min-width: 0; }
.course-body.done { text-decoration: line-through; opacity: 0.5; }
.course-title {
  font-size: 14px; font-weight: 600; color: var(--choco);
  margin-bottom: 2px;
}
.course-sub {
  font-size: 11px; color: var(--choco-hint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.course-go-btn {
  padding: 7px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--mint);
  background: var(--white);
  color: var(--mint);
  font-size: 12px; font-weight: 600;
  cursor: pointer; flex-shrink: 0;
  transition: all 0.2s;
  font-family: inherit;
}
.course-go-btn:active { background: var(--mint); color: var(--white); }
.course-empty {
  text-align: center; padding: 20px 0;
  color: var(--choco-hint); font-size: 13px;
}

/* ============================================
   第4块：第三方APP快捷跳转
   ============================================ */
.app-jump-card {
  background: var(--white);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.app-jump-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.app-jump-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: var(--mint-lighter);
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
}
.app-jump-item:active { transform: scale(0.96); }
.app-jump-icon {
  width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.app-jump-icon.keep { background: linear-gradient(135deg, #6B9AC4 0%, #6B9AC4 100%); }
.app-jump-icon.ant { background: linear-gradient(135deg, #1677FF 0%, #69B1FF 100%); }
.app-jump-body { flex: 1; min-width: 0; }
.app-jump-name {
  font-size: 14px; font-weight: 600; color: var(--choco);
  margin-bottom: 2px;
}
.app-jump-desc {
  font-size: 11px; color: var(--choco-hint);
}
.app-jump-arrow {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--white);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.app-jump-arrow svg { width: 12px; height: 12px; color: var(--choco-light); }

/* --- 底部操作栏 --- */
.footer {
  position: fixed; bottom: 56px; left: 104px; right: 0; width: auto; max-width: calc(430px - 104px);
  display: flex; gap: 12px;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  z-index: 50;
}
.btn-primary {
  flex: 2; height: 48px; border: none; border-radius: 14px;
  background: var(--mint); color: var(--white);
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform 0.15s;
}
.btn-primary:active { transform: scale(0.97); }
.btn-primary.checked { background: var(--mint-light); color: var(--choco); border: 1.5px solid var(--mint); }
.btn-secondary {
  flex: 1; height: 48px; border: 1.5px solid var(--mint); border-radius: 14px;
  background: var(--white); color: var(--choco);
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all 0.2s;
}
.btn-secondary:active { background: var(--mint-light); transform: scale(0.97); }

/* --- Toast --- */
.toast {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: rgba(93, 64, 55, 0.9); color: #fff;
  padding: 14px 22px; border-radius: 14px;
  font-size: 13px; font-weight: 500;
  z-index: 999; opacity: 0; visibility: hidden;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
}
.toast.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

/* --- 右侧抽屉 --- */
.drawer-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.35); z-index: 300; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
.drawer-overlay.open { opacity: 1; visibility: visible; }
.drawer { position: fixed; top: 0; left: -160px; width: 160px; height: 100%; background: var(--white); z-index: 301; transition: left 0.35s cubic-bezier(0.32,0.72,0,1); display: flex; flex-direction: column; box-shadow: 4px 0 24px rgba(0,0,0,0.08); }
.drawer.open { left: 0; }
.drawer-header { padding: 16px 12px 12px; border-bottom: 1px solid var(--border); }
.drawer-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--mint); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; font-size: 28px; }
.drawer-title { font-size: 15px; font-weight: 700; color: var(--choco); margin-bottom: 4px; }
.drawer-subtitle { font-size: 11px; color: var(--choco-hint); }
.drawer-menu { flex: 1; overflow-y: auto; padding: 12px 0; }
.drawer-menu-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; transition: background 0.2s; text-decoration: none; color: var(--choco); font-size: 13px; }
.drawer-menu-item:active { background: var(--mint-light); }
.drawer-menu-item.active { background: var(--mint-light); color: var(--mint); font-weight: 600; }
.drawer-menu-item .menu-emoji { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
.drawer-menu-item.home-link { border-bottom: 1px solid var(--border); margin-bottom: 8px; color: var(--mint); font-weight: 600; }
.drawer-footer { padding: 12px 12px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 20px) + 56px)); border-top: 1px solid var(--border); }
.drawer-reset-btn { width: 100%; padding: 12px; border-radius: 12px; background: var(--mint-light); border: 1.5px solid var(--mint); color: var(--choco); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
.drawer-reset-btn:active { background: var(--mint); color: #fff; }

/* ===== 底部导航栏 ===== */
.bottom-nav { position: fixed; bottom: 0; left: 104px; right: 0; width: auto; max-width: calc(430px - 104px); display: flex; background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid #E8E8E8; z-index: 200; padding-bottom: env(safe-area-inset-bottom, 0); }
.nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 8px 0 10px; cursor: pointer; background: none; border: none; transition: all 0.2s; font-family: inherit; }
.nav-tab:active { transform: scale(0.92); }
.nav-tab svg { width: 24px; height: 24px; color: #B0B0B0; transition: color 0.2s; }
.nav-tab .nav-tab-label { font-size: 11px; color: #B0B0B0; font-weight: 500; transition: color 0.2s; }
.nav-tab.active svg { color: #6B9AC4; }
.nav-tab.active .nav-tab-label { color: #6B9AC4; font-weight: 600; }

/* ===== 左侧固定侧边栏 ===== */
.sidebar { position: fixed; top: 0; left: 0; width: 104px; height: 100vh; background: #F5F5F7; z-index: 250; display: flex; flex-direction: column; border-right: 1px solid #E8E8E8; }
.sidebar-header { padding: 14px 10px 10px; border-bottom: 1px solid #ECECEC; flex-shrink: 0; }
.sidebar-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #6B9AC4 0%, #8AB5D6 100%); margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.sidebar-name { font-size: 16px; font-weight: 700; color: #3D3D3D; line-height: 1.3; text-align: center; }
.sidebar-menu { flex: 1; overflow-y: auto; padding: 6px 0; -webkit-overflow-scrolling: touch; }
.sidebar-menu::-webkit-scrollbar { display: none; }
.sidebar-item { display: flex; flex-direction: row; align-items: center; gap: 8px; padding: 9px 10px; cursor: pointer; text-decoration: none; color: #8A8A8A; transition: all 0.2s; margin: 2px 6px; border-radius: 10px; }
.sidebar-item:active { transform: scale(0.95); }
.sidebar-item .sb-icon { font-size: 20px; line-height: 1; flex-shrink: 0; }
.sidebar-item .sb-label { font-size: 15px; font-weight: 600; line-height: 1.2; }
.sidebar-item.active { background: rgba(107, 154, 196, 0.15); color: #6B9AC4; }
.sidebar-item.active .sb-label { font-weight: 700; }
</style>
</head>

<div class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-avatar">🧸</div>
    <div class="sidebar-name">工作台</div>
  </div>
  <div class="sidebar-menu">

    <a class="sidebar-item" href="detail-weight.html"><span class="sb-icon">📋</span><span class="sb-label">待办</span></a>

  </div>
</div>

<!-- ===== 主体内容 ===== -->
<div class="main">
  <!-- 第1块：进度统计大卡片 -->
  <div class="progress-card">
    <div class="progress-left">
      <div class="progress-num" id="streakNum">0</div>
      <div class="progress-num-label">连续打卡(天)</div>
    </div>
    <div class="progress-right">
      <div class="progress-right-title">今日完成进度</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
      </div>
      <div class="progress-ratio" id="progressRatio">0/0</div>
    </div>
  </div>

  <!-- 第2块：晨间仪式 -->
  <div class="section-title"><span class="emoji">🌅</span>晨间仪式</div>
  <div class="morning-card">
    <div class="morning-item">
      <div class="morning-icon">⏰</div>
      <div class="morning-body">
        <div class="morning-name">起床时间</div>
        <div class="morning-desc">养成早起好习惯</div>
      </div>
      <div class="morning-action">
        <input type="time" class="morning-time-input" id="wakeTime" value="07:00">
      </div>
    </div>
    <div class="morning-item">
      <div class="morning-icon">⚖️</div>
      <div class="morning-body">
        <div class="morning-name">早上体重</div>
        <div class="morning-desc">空腹记录更准确</div>
      </div>
      <div class="morning-action">
        <button class="morning-check" id="weightCheck" type="button">✓</button>
      </div>
    </div>
    <div class="morning-item">
      <div class="morning-icon">💧</div>
      <div class="morning-body">
        <div class="morning-name">一杯温水</div>
        <div class="morning-desc">唤醒身体代谢</div>
      </div>
      <div class="morning-action">
        <button class="morning-check" id="waterCheck" type="button">✓</button>
      </div>
    </div>

<script>
/* ===== 工具函数 ===== */
function getTodayKey(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function getCheckinRecords(){try{var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');return d[getTodayKey()]||[]}catch(e){return[]}}
function isChecked(id){return getCheckinRecords().indexOf(id)!==-1}
function submitCheckin(id){var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');var t=getTodayKey();if(!d[t])d[t]=[];if(d[t].indexOf(id)===-1){d[t].push(id);localStorage.setItem('checkin_records',JSON.stringify(d))}showToast('打卡成功 🏃')}
function undoCheckin(id){var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');var t=getTodayKey();if(d[t]){d[t]=d[t].filter(function(i){return i!==id});localStorage.setItem('checkin_records',JSON.stringify(d))}showToast('已撤销打卡')}
function toggleCheckin(id){if(isChecked(id)){undoCheckin(id)}else{submitCheckin(id)}}

/* Toast */
function showToast(msg){var e=document.getElementById('appToast');if(e)e.remove();var t=document.createElement('div');t.className='toast';t.id='appToast';t.textContent=msg;document.body.appendChild(t);requestAnimationFrame(function(){t.classList.add('show')});setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove()},300)},1500)}

/* 抽屉 */
/* 抽屉已移除，使用侧边栏导航 */
function resetToday(){try{localStorage.setItem('checkin_records',JSON.stringify({}))}catch(e){}showToast('今日打卡已重置 🏃')}

/* ===== 进度统计 ===== */
function updateProgress(){
  var done=Object.values(courseCheckins).filter(function(v){return v}).length;
  var total=Object.keys(courseCheckins).length||1;
  var pct=Math.round(done/total*100);
  var pb=document.getElementById('progressBar');
  var pr=document.getElementById('progressRatio');
  if(pb)pb.style.width=pct+'%';
  if(pr)pr.textContent=done+'/'+total;
}

/* 连续天数（简化计算：有打卡记录的天数） */
function getStreakDays(){
  try{
    var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');
    var keys=Object.keys(d).filter(function(k){return d[k]&&d[k].length>0});
    return keys.length;
  }catch(e){return 0}
}
function animateNum(el,target){
  if(!el)return;
  var current=0;
  var step=Math.max(1,Math.floor(target/20));
  function tick(){
    current+=step;
    if(current>=target){current=target;el.textContent=current;return}
    el.textContent=current;
    requestAnimationFrame(tick);
  }
  tick();
}

/* ===== 晨间仪式（按日期持久化） ===== */
function getMorningData(){
  try{
    var d=JSON.parse(localStorage.getItem('exercise_morning')||'{}');
    return d[getTodayKey()]||{weight:false,water:false,wakeTime:'07:00'};
  }catch(e){return {weight:false,water:false,wakeTime:'07:00'}}
}
function saveMorningData(data){
  try{
    var d=JSON.parse(localStorage.getItem('exercise_morning')||'{}');
    d[getTodayKey()]=data;
    localStorage.setItem('exercise_morning',JSON.stringify(d));
  }catch(e){}
}
function toggleMorningCheck(el){
  var data=getMorningData();
  if(el.id==='weightCheck'){data.weight=!data.weight;el.classList.toggle('done',data.weight)}
  if(el.id==='waterCheck'){data.water=!data.water;el.classList.toggle('done',data.water)}
  saveMorningData(data);
  updateProgress();
}
function loadMorningState(){
  var data=getMorningData();
  var wc=document.getElementById('weightCheck');
  var wac=document.getElementById('waterCheck');
  var wt=document.getElementById('wakeTime');
  if(wc&&data.weight)wc.classList.add('done');
  if(wac&&data.water)wac.classList.add('done');
  if(wt&&data.wakeTime)wt.value=data.wakeTime;
}

function loadCheckins(){
  try{
    var d=JSON.parse(localStorage.getItem('exercise_course_checkins')||'{}');
    courseCheckins=d[getTodayKey()]||{};
  }catch(e){courseCheckins={}}
}
function saveCheckins(){
  try{
    var d=JSON.parse(localStorage.getItem('exercise_course_checkins')||'{}');
    d[getTodayKey()]=courseCheckins;
    localStorage.setItem('exercise_course_checkins',JSON.stringify(d));
  }catch(e){}
}
function toggleCourseCheckin(cid){
  courseCheckins[cid]=!courseCheckins[cid];
  saveCheckins();
  renderCourses();
  updateProgress();
  renderHistory();
}

function renderCourses(){
  var courses=coursesData[currentL1]&&coursesData[currentL1][currentL2]||[];
  var container=document.getElementById('courseList');
  if(!container)return;
  if(courses.length===0){container.innerHTML='<div class="course-empty">暂未添加课程，后续可自定义</div>';return}
  container.innerHTML=courses.map(function(c){
    var done=courseCheckins[c.id];
    return '<div class="course-item">'+
      '<button class="course-check'+(done?' done':'')+'" data-cid="'+c.id+'" type="button">✓</button>'+
      '<div class="course-body'+(done?' done':'')+'">'+
        '<div class="course-title">'+c.title+'</div>'+
        '<div class="course-sub">'+c.sub+'</div>'+
      '</div>'+
      '<button class="course-go-btn" data-url="'+c.url+'" type="button">跟练</button>'+
    '</div>';
  }).join('');
  /* 绑定勾选事件 */
  container.querySelectorAll('.course-check').forEach(function(btn){
    btn.addEventListener('click',function(e){e.stopPropagation();toggleCourseCheckin(this.getAttribute('data-cid'))});
  });
  /* 绑定跟练跳转 */
  container.querySelectorAll('.course-go-btn').forEach(function(btn){
    btn.addEventListener('click',function(e){e.stopPropagation();
      var url=this.getAttribute('data-url');
      if(url&&url!=='#')window.location.href=url;else showToast('请先设置课程链接');
    });
  });
}

function switchL1(l1){
  currentL1=l1;currentL2='glutes';
  document.querySelectorAll('.tag-l1').forEach(function(t){t.classList.remove('active')});
  document.querySelector('.tag-l1[data-l1="'+l1+'"]').classList.add('active');
  document.querySelectorAll('.tag-l2').forEach(function(t){t.classList.remove('active')});
  document.querySelector('.tag-l2[data-l2="glutes"]').classList.add('active');
  renderCourses();
}

function switchL2(l2){
  currentL2=l2;
  document.querySelectorAll('.tag-l2').forEach(function(t){t.classList.remove('active')});
  document.querySelector('.tag-l2[data-l2="'+l2+'"]').classList.add('active');
  renderCourses();
}

/* 更新进度（基于课程打卡 + 晨间仪式） */
function updateProgress(){
  var courseDone=Object.values(courseCheckins).filter(function(v){return v}).length;
  var morning=getMorningData();
  var morningDone=(morning.weight?1:0)+(morning.water?1:0);
  var done=courseDone+morningDone;
  var total=(Object.keys(courseCheckins).length||0)+2;
  var pct=total>0?Math.round(done/total*100):0;
  var pb=document.getElementById('progressBar');
  var pr=document.getElementById('progressRatio');
  if(pb)pb.style.width=pct+'%';
  if(pr)pr.textContent=done+'/'+total;
  updateFooterBtn();
}

/* 底部按钮状态 */
function updateFooterBtn(){
  var btn=document.getElementById('checkinBtn');
  if(!btn)return;
  var courseAny=Object.values(courseCheckins).some(function(v){return v});
  var morning=getMorningData();
  var morningAny=morning.weight||morning.water;
  if(courseAny||morningAny){
    btn.classList.add('checked');
    btn.textContent='✓ 今日已打卡';
  }else{
    btn.classList.remove('checked');
    btn.textContent='打卡提交';
  }
}

/* ===== 打卡记录历史 ===== */
function getHistoryRecords(){
  var records=[];
  try{
    var courseData=JSON.parse(localStorage.getItem('exercise_course_checkins')||'{}');
    var morningData=JSON.parse(localStorage.getItem('exercise_morning')||'{}');
    var dates=Object.keys({}).concat(Object.keys(courseData),Object.keys(morningData));
    var uniqueDates=[...new Set(dates)].sort().reverse().slice(0,7);
    uniqueDates.forEach(function(date){
      var courses=courseData[date]||{};
      var courseList=Object.keys(courses).filter(function(k){return courses[k]});
      var morning=morningData[date]||{};
      var morningList=[];
      if(morning.weight)morningList.push('体重');
      if(morning.water)morningList.push('温水');
      var allItems=morningList.concat(courseList);
      if(allItems.length>0){
        records.push({date:date,items:allItems,morning:morning,courses:courseList});
      }
    });
  }catch(e){}
  return records;
}

function getCourseNameById(id){
  for(var l1 in coursesData){
    for(var l2 in coursesData[l1]){
      for(var i=0;i<coursesData[l1][l2].length;i++){
        if(coursesData[l1][l2][i].id===id)return coursesData[l1][l2][i].title;
      }
    }
  }
  return id;
}

function formatDate(dateStr){
  var parts=dateStr.split('-');
  return parts[1]+'-'+parts[2];
}

function renderHistory(){
  var container=document.getElementById('historyList');
  if(!container)return;
  var records=getHistoryRecords();
  if(records.length===0){
    container.innerHTML='<div style="text-align:center;padding:20px 0;color:var(--choco-hint);font-size:13px;">暂无打卡记录，开始你的第一次打卡吧 💪</div>';
    return;
  }
  container.innerHTML=records.map(function(r){
    var itemTags=r.items.map(function(item){
      var display=item==='体重'?'⚖️ 体重':item==='温水'?'💧 温水':getCourseNameById(item);
      return '<span style="display:inline-block;padding:3px 10px;background:var(--mint-light);color:var(--mint);border-radius:8px;font-size:11px;font-weight:600;margin:2px;">'+display+'</span>';
    }).join('');
    return '<div style="padding:12px 0;border-bottom:1px solid var(--border);">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">'+
        '<span style="font-size:13px;font-weight:600;color:var(--choco);">'+formatDate(r.date)+'</span>'+
        '<span style="font-size:11px;color:var(--mint);font-weight:600;">'+r.items.length+'项</span>'+
      '</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:2px;">'+itemTags+'</div>'+
    '</div>';
  }).join('');
}

/* ===== 事件绑定 ===== */
document.addEventListener('DOMContentLoaded',function(){
  /* 抽屉 */
  var resetBtn=document.getElementById('resetBtn');
  if(resetBtn)resetBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();resetToday()});

  /* 底部按钮 - 保存今日打卡 */
  var checkinBtn=document.getElementById('checkinBtn');
  var saveBtn=document.getElementById('saveBtn');
  if(checkinBtn)checkinBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();toggleCheckin(4)});
  if(saveBtn)saveBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();showToast('记录已保存 ✓');renderHistory()});

  /* 晨间仪式勾选 */
  var weightCheck=document.getElementById('weightCheck');
  var waterCheck=document.getElementById('waterCheck');
  if(weightCheck)weightCheck.addEventListener('click',function(e){e.stopPropagation();toggleMorningCheck(this);renderHistory()});
  if(waterCheck)waterCheck.addEventListener('click',function(e){e.stopPropagation();toggleMorningCheck(this);renderHistory()});

  /* 起床时间保存 */
  var wakeTime=document.getElementById('wakeTime');
  if(wakeTime)wakeTime.addEventListener('change',function(e){
    var data=getMorningData();data.wakeTime=this.value;saveMorningData(data);
  });

  /* 两级标签切换 */
  document.querySelectorAll('.tag-l1').forEach(function(t){
    t.addEventListener('click',function(e){e.stopPropagation();switchL1(this.getAttribute('data-l1'))});
  });
  document.querySelectorAll('.tag-l2').forEach(function(t){
    t.addEventListener('click',function(e){e.stopPropagation();switchL2(this.getAttribute('data-l2'))});
  });

  /* 第三方APP跳转 */
  var appKeep=document.getElementById('appKeep');
  var appAnt=document.getElementById('appAnt');
  if(appKeep)appKeep.addEventListener('click',function(e){e.stopPropagation();window.location.href='https://m.gotokeep.com/fd-page/shareSportRecord?shareid=6a6b698ee1540a00010d37e3&title_type=group_a&utm_source=wechat'});
  if(appAnt)appAnt.addEventListener('click',function(e){e.stopPropagation();window.location.href='https://u.antaq.com/?scheme=aijk%3A%2F%2Fplatformapi%2Fstartapp%3FappId%3D20002184%26ijk_source%3Dmain_chat_share'});

  /* 初始化：加载数据 → 恢复状态 → 渲染 */
  loadCheckins();
  loadMorningState();
  var streak=getStreakDays();
  animateNum(document.getElementById('streakNum'),streak);
  renderCourses();
  updateProgress();
  renderHistory();
});
</script>

  var h=document.getElementById('navHome'),t=document.getElementById('navTodo'),m=document.getElementById('navMine');
  if(h)h.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();window.location.href='index.html'});
  if(t)t.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();window.location.href='index.html#todo'});
  if(m)m.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();window.location.href='index.html#mine'});
});
</script>

</body>
