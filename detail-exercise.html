<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>锻炼身体</title>
<meta name="theme-color" content="#7DD3C0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
/* ============================================
   锻炼身体页 - 薄荷绿 × 天空蓝
   ============================================ */
:root {
  --mint: #7DD3C0;
  --mint-light: #E8F5F1;
  --mint-lighter: #F5FBF9;
  --choco: #5D4037;
  --choco-light: #8D7B68;
  --choco-hint: #B5A99A;
  --blue: #5B9BD5;
  --blue-light: #EBF3FA;
  --blue-soft: #F0F7FF;
  --border: #D4E8E0;
  --white: #FFFFFF;
  --shadow: 0 2px 12px rgba(125, 211, 192, 0.12);
  --shadow-float: 0 4px 20px rgba(91, 155, 213, 0.15);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  background: #F5FAFC;
  color: var(--choco);
  min-height: 100vh;
  max-width: 430px;
  margin: 0 auto;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 140px;
}

/* --- 顶部导航栏 --- */
.header {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; padding: 0 16px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
}
.header-back {
  width: 36px; height: 36px; border: none; border-radius: 50%;
  background: var(--mint-light); display: flex; align-items: center; justify-content: center;
  text-decoration: none; color: var(--choco); font-size: 18px; flex-shrink: 0;
}
.header-back:active { transform: scale(0.92); }
.header-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; color: var(--choco); }
.header-drawer {
  width: 36px; height: 36px; border: none; border-radius: 50%;
  background: var(--mint); display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.header-drawer:active { transform: scale(0.92); }
.header-drawer span { display: block; width: 14px; height: 2px; background: var(--white); border-radius: 1px; margin: 1.5px 0; }

/* --- 主体内容 --- */
.main { padding: 16px 16px 0; }

/* ============================================
   第1块：进度统计大卡片
   ============================================ */
.progress-card {
  background: linear-gradient(135deg, #7DD3C0 0%, #6CB4F5 100%);
  border-radius: 20px;
  padding: 24px 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-float);
  color: var(--white);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.progress-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.progress-num {
  font-size: 56px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -2px;
  font-variant-numeric: tabular-nums;
}
.progress-num-label {
  font-size: 12px;
  font-weight: 500;
  opacity: 0.85;
  margin-top: 4px;
}
.progress-right {
  flex: 1;
  min-width: 0;
}
.progress-right-title {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 8px;
  opacity: 0.95;
}
.progress-bar-wrap {
  height: 6px;
  background: rgba(255,255,255,0.25);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 8px;
}
.progress-bar-fill {
  height: 100%;
  background: var(--white);
  border-radius: 3px;
  transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.progress-ratio {
  font-size: 13px;
  font-weight: 600;
  text-align: right;
  opacity: 0.9;
}

/* 数字滚动动画 */
@keyframes countUp {
  from { transform: translateY(40%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.progress-num.animate { animation: countUp 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

/* ============================================
   第2块：晨间仪式打卡清单
   ============================================ */
.section-title {
  font-size: 15px; font-weight: 600; color: var(--choco);
  margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  padding: 0 4px;
}
.section-title .emoji { font-size: 18px; }

.morning-card {
  background: var(--white);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.morning-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.morning-header-title {
  font-size: 15px; font-weight: 600; color: var(--choco);
  display: flex; align-items: center; gap: 8px;
}
.morning-header-count {
  font-size: 13px; color: var(--mint);
  font-weight: 600;
}

.morning-item {
  display: flex; align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.morning-item:last-child { border-bottom: none; }
.morning-icon {
  width: 36px; height: 36px; border-radius: 10px;
  background: var(--blue-soft);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.morning-body { flex: 1; min-width: 0; }
.morning-name { font-size: 14px; font-weight: 600; color: var(--choco); margin-bottom: 2px; }
.morning-desc { font-size: 11px; color: var(--choco-hint); }
.morning-action { flex-shrink: 0; }
.morning-time-input {
  width: 70px; height: 32px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  text-align: center;
  font-size: 13px; font-weight: 600;
  color: var(--choco);
  background: var(--white);
  font-family: inherit;
  outline: none;
}
.morning-time-input:focus { border-color: var(--mint); }
.morning-check {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--mint);
  background: var(--white);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: all 0.25s ease;
  font-size: 13px; color: transparent;
}
.morning-check:active { transform: scale(0.9); }
.morning-check.done {
  background: var(--mint);
  border-color: var(--mint);
  color: var(--white);
}

/* ============================================
   第3块：运动内容（两级标签 + 课程打卡）
   ============================================ */
.exercise-card {
  background: var(--white);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}

/* 一级标签 */
.tag-row-1 {
  display: flex; gap: 10px; margin-bottom: 14px;
}
.tag-l1 {
  flex: 1; text-align: center;
  padding: 10px 4px;
  border-radius: 14px;
  border: 1.5px solid var(--border);
  background: var(--white);
  font-size: 14px; font-weight: 600; color: var(--choco);
  cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
  gap: 4px;
}
.tag-l1:active { transform: scale(0.96); }
.tag-l1.active {
  background: var(--mint-light);
  border-color: var(--mint);
  color: var(--choco);
}

/* 二级标签 */
.tag-row-2 {
  display: flex; gap: 8px; margin-bottom: 16px;
  flex-wrap: wrap;
}
.tag-l2 {
  padding: 7px 14px;
  border-radius: 12px;
  border: 1.5px solid var(--border);
  background: var(--white);
  font-size: 12px; font-weight: 500; color: var(--choco-light);
  cursor: pointer; transition: all 0.2s;
}
.tag-l2:active { transform: scale(0.96); }
.tag-l2.active {
  background: var(--mint-light);
  border-color: var(--mint);
  color: var(--choco);
  font-weight: 600;
}

/* 课程打卡列表 */
.course-list {
  display: flex; flex-direction: column; gap: 10px;
}
.course-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px;
  background: var(--mint-lighter);
  border-radius: 14px;
  transition: all 0.2s;
}
.course-check {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid var(--mint);
  background: var(--white);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: all 0.25s ease;
  font-size: 12px; color: transparent;
}
.course-check:active { transform: scale(0.9); }
.course-check.done {
  background: var(--mint);
  border-color: var(--mint);
  color: var(--white);
}
.course-body { flex: 1; min-width: 0; }
.course-body.done { text-decoration: line-through; opacity: 0.5; }
.course-title {
  font-size: 14px; font-weight: 600; color: var(--choco);
  margin-bottom: 2px;
}
.course-sub {
  font-size: 11px; color: var(--choco-hint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.course-go-btn {
  padding: 7px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--mint);
  background: var(--white);
  color: var(--mint);
  font-size: 12px; font-weight: 600;
  cursor: pointer; flex-shrink: 0;
  transition: all 0.2s;
  font-family: inherit;
}
.course-go-btn:active { background: var(--mint); color: var(--white); }
.course-empty {
  text-align: center; padding: 20px 0;
  color: var(--choco-hint); font-size: 13px;
}

/* ============================================
   第4块：第三方APP快捷跳转
   ============================================ */
.app-jump-card {
  background: var(--white);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.app-jump-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
.app-jump-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: var(--mint-lighter);
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
}
.app-jump-item:active { transform: scale(0.96); }
.app-jump-icon {
  width: 44px; height: 44px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.app-jump-icon.keep { background: linear-gradient(135deg, #7DD3C0 0%, #5B9BD5 100%); }
.app-jump-icon.ant { background: linear-gradient(135deg, #1677FF 0%, #69B1FF 100%); }
.app-jump-body { flex: 1; min-width: 0; }
.app-jump-name {
  font-size: 14px; font-weight: 600; color: var(--choco);
  margin-bottom: 2px;
}
.app-jump-desc {
  font-size: 11px; color: var(--choco-hint);
}
.app-jump-arrow {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--white);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.app-jump-arrow svg { width: 12px; height: 12px; color: var(--choco-light); }

/* --- 底部操作栏 --- */
.footer {
  position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px;
  display: flex; gap: 12px;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  z-index: 50;
}
.btn-primary {
  flex: 2; height: 48px; border: none; border-radius: 14px;
  background: var(--mint); color: var(--white);
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform 0.15s;
}
.btn-primary:active { transform: scale(0.97); }
.btn-primary.checked { background: var(--mint-light); color: var(--choco); border: 1.5px solid var(--mint); }
.btn-secondary {
  flex: 1; height: 48px; border: 1.5px solid var(--mint); border-radius: 14px;
  background: var(--white); color: var(--choco);
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all 0.2s;
}
.btn-secondary:active { background: var(--mint-light); transform: scale(0.97); }

/* --- Toast --- */
.toast {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: rgba(93, 64, 55, 0.9); color: #fff;
  padding: 14px 22px; border-radius: 14px;
  font-size: 13px; font-weight: 500;
  z-index: 999; opacity: 0; visibility: hidden;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
}
.toast.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

/* --- 右侧抽屉 --- */
.drawer-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.35); z-index: 300; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
.drawer-overlay.open { opacity: 1; visibility: visible; }
.drawer { position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: var(--white); z-index: 301; transition: right 0.35s cubic-bezier(0.32,0.72,0,1); display: flex; flex-direction: column; box-shadow: -4px 0 24px rgba(0,0,0,0.08); }
.drawer.open { right: 0; }
.drawer-header { padding: 24px 20px 16px; border-bottom: 1px solid var(--border); }
.drawer-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--mint); display: flex; align-items: center; justify-content: center; margin-bottom: 12px; font-size: 28px; }
.drawer-title { font-size: 18px; font-weight: 700; color: var(--choco); margin-bottom: 4px; }
.drawer-subtitle { font-size: 13px; color: var(--choco-hint); }
.drawer-menu { flex: 1; overflow-y: auto; padding: 12px 0; }
.drawer-menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; cursor: pointer; transition: background 0.2s; text-decoration: none; color: var(--choco); font-size: 15px; }
.drawer-menu-item:active { background: var(--mint-light); }
.drawer-menu-item.active { background: var(--mint-light); color: var(--mint); font-weight: 600; }
.drawer-menu-item .menu-emoji { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; }
.drawer-menu-item.home-link { border-bottom: 1px solid var(--border); margin-bottom: 8px; color: var(--mint); font-weight: 600; }
.drawer-footer { padding: 16px 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 20px) + 56px)); border-top: 1px solid var(--border); }
.drawer-reset-btn { width: 100%; padding: 12px; border-radius: 12px; background: var(--mint-light); border: 1.5px solid var(--mint); color: var(--choco); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
.drawer-reset-btn:active { background: var(--mint); color: #fff; }

/* ===== 底部导航栏 ===== */
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; display: flex; background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid #E8E8E8; z-index: 200; padding-bottom: env(safe-area-inset-bottom, 0); }
.nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 8px 0 10px; cursor: pointer; background: none; border: none; transition: all 0.2s; font-family: inherit; }
.nav-tab:active { transform: scale(0.92); }
.nav-tab svg { width: 24px; height: 24px; color: #B0B0B0; transition: color 0.2s; }
.nav-tab .nav-tab-label { font-size: 11px; color: #B0B0B0; font-weight: 500; transition: color 0.2s; }
.nav-tab.active svg { color: #6B9AC4; }
.nav-tab.active .nav-tab-label { color: #6B9AC4; font-weight: 600; }
</style>
</head>

<script>
/* ===== 工具函数 ===== */
function getTodayKey(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function getCheckinRecords(){try{var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');return d[getTodayKey()]||[]}catch(e){return[]}}
function isChecked(id){return getCheckinRecords().indexOf(id)!==-1}
function submitCheckin(id){var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');var t=getTodayKey();if(!d[t])d[t]=[];if(d[t].indexOf(id)===-1){d[t].push(id);localStorage.setItem('checkin_records',JSON.stringify(d))}showToast('打卡成功 🏃')}
function undoCheckin(id){var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');var t=getTodayKey();if(d[t]){d[t]=d[t].filter(function(i){return i!==id});localStorage.setItem('checkin_records',JSON.stringify(d))}showToast('已撤销打卡')}
function toggleCheckin(id){if(isChecked(id)){undoCheckin(id)}else{submitCheckin(id)}}

/* Toast */
function showToast(msg){var e=document.getElementById('appToast');if(e)e.remove();var t=document.createElement('div');t.className='toast';t.id='appToast';t.textContent=msg;document.body.appendChild(t);requestAnimationFrame(function(){t.classList.add('show')});setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove()},300)},1500)}

/* 抽屉 */
function toggleDrawer(){var o=document.getElementById('drawerOverlay'),d=document.getElementById('sideDrawer');var isOpen=d.classList.contains('open');if(isOpen){d.classList.remove('open');o.classList.remove('open');document.body.style.overflow=''}else{d.classList.add('open');o.classList.add('open');document.body.style.overflow='hidden'}}
function resetToday(){try{localStorage.setItem('checkin_records',JSON.stringify({}))}catch(e){}toggleDrawer();showToast('今日打卡已重置 🏃')}

/* ===== 进度统计 ===== */
function updateProgress(){
  var records=getCheckinRecords();
  var total=3; // 3个运动类型
  var done=0;
  if(records.indexOf('cardio')!==-1)done++;
  if(records.indexOf('strength')!==-1)done++;
  if(records.indexOf('hiit')!==-1)done++;
  var pct=Math.round(done/total*100);
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('progressRatio').textContent=done+'/'+total;
  document.getElementById('morningCount').textContent=done+'/'+total;
}

/* 连续天数（简化计算：有打卡记录的天数） */
function getStreakDays(){
  try{
    var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');
    var keys=Object.keys(d).filter(function(k){return d[k]&&d[k].length>0});
    return keys.length;
  }catch(e){return 0}
}
function animateNum(el,target){
  var current=0;
  var step=Math.max(1,Math.floor(target/20));
  function tick(){
    current+=step;
    if(current>=target){current=target;el.textContent=current;return}
    el.textContent=current;
    requestAnimationFrame(tick);
  }
  tick();
}

/* ===== 晨间仪式 ===== */
function toggleMorningCheck(el){
  el.classList.toggle('done');
  updateProgress();
}

/* ===== 运动打卡 - 两级标签 ===== */
var currentL1='strength';
var currentL2='glutes';
var courseCheckins={}; // {courseId:true/false}

/* 课程数据（自定义，后续可改） */
var coursesData={
  strength:{glutes:[
    {id:'sq1',title:'杠铃深蹲',sub:'4组×12次 / 臀腿王牌动作',url:'#'},

  ],arms:[

    {id:'am3',title:'锤式弯举',sub:'3组×15次 / 肱肌',url:'#'}
  ],other:[

    {id:'ot2',title:'面拉',sub:'3组×15次 / 肩袖肌群',url:'#'},
    {id:'ot3',title:'山羊挺身',sub:'3组×12次 / 下背部',url:'#'}
  ]},
  cardio:{glutes:[
    {id:'cg1',title:'慢跑',sub:'5公里 / 配速6:00-7:00',url:'#'},
    {id:'cg2',title:'椭圆机',sub:'30分钟 / 阻力8-10',url:'#'},

  ],back:[

  ],arms:[

    {id:'ca2',title:'拳击空击',sub:'3组×3分钟 / 协调性',url:'#'},
    {id:'ca3',title:'药球砸墙',sub:'3组×12次 / 上肢力量',url:'#'}
  ],other:[

  ],core:[

    {id:'pc3',title:'侧板支撑',sub:'3组×30秒/边 / 侧腹',url:'#'}
  ],arms:[
    {id:'pa1',title:'瑜伽流',sub:'20分钟 / 全身流动',url:'#'},

    {id:'pa3',title:'手臂平衡',sub:'3组×尝试 / 核心+手臂',url:'#'}
  ],other:[
    {id:'po1',title:'阴瑜伽',sub:'30分钟 / 深度拉伸',url:'#'},
    {id:'po2',title:'冥想呼吸',sub:'10分钟 / 放松恢复',url:'#'},
    {id:'po3',title:'泡沫轴放松',sub:'15分钟 / 全身按摩',url:'#'}
  ]}
};

function loadCheckins(){try{var d=JSON.parse(localStorage.getItem('exercise_course_checkins')||'{}');courseCheckins=d}catch(e){courseCheckins={}}}
function saveCheckins(){localStorage.setItem('exercise_course_checkins',JSON.stringify(courseCheckins))}
function toggleCourseCheckin(cid){
  courseCheckins[cid]=!courseCheckins[cid];
  saveCheckins();
  renderCourses();
  updateProgress();
  updateFooterBtn();
}

function renderCourses(){
  var courses=coursesData[currentL1]&&coursesData[currentL1][currentL2]||[];
  var container=document.getElementById('courseList');
  if(!container)return;
  if(courses.length===0){container.innerHTML='<div class="course-empty">暂未添加课程，后续可自定义</div>';return}
  container.innerHTML=courses.map(function(c){
    var done=courseCheckins[c.id];
    return '<div class="course-item">'+
      '<button class="course-check'+(done?' done':'')+'" data-cid="'+c.id+'" type="button">✓</button>'+
      '<div class="course-body'+(done?' done':'')+'">'+
        '<div class="course-title">'+c.title+'</div>'+
        '<div class="course-sub">'+c.sub+'</div>'+
      '</div>'+
      '<button class="course-go-btn" data-url="'+c.url+'" type="button">跟练</button>'+
    '</div>';
  }).join('');
  /* 绑定勾选事件 */
  container.querySelectorAll('.course-check').forEach(function(btn){
    btn.addEventListener('click',function(e){e.stopPropagation();toggleCourseCheckin(this.getAttribute('data-cid'))});
  });
  /* 绑定跟练跳转 */
  container.querySelectorAll('.course-go-btn').forEach(function(btn){
    btn.addEventListener('click',function(e){e.stopPropagation();
      var url=this.getAttribute('data-url');
      if(url&&url!=='#')window.location.href=url;else showToast('请先设置课程链接');
    });
  });
}

function switchL1(l1){
  currentL1=l1;currentL2='glutes';
  document.querySelectorAll('.tag-l1').forEach(function(t){t.classList.remove('active')});
  document.querySelector('.tag-l1[data-l1="'+l1+'"]').classList.add('active');
  document.querySelectorAll('.tag-l2').forEach(function(t){t.classList.remove('active')});
  document.querySelector('.tag-l2[data-l2="glutes"]').classList.add('active');
  renderCourses();
}

function switchL2(l2){
  currentL2=l2;
  document.querySelectorAll('.tag-l2').forEach(function(t){t.classList.remove('active')});
  document.querySelector('.tag-l2[data-l2="'+l2+'"]').classList.add('active');
  renderCourses();
}

/* 更新进度（基于课程打卡） */
function updateProgress(){
  var done=Object.values(courseCheckins).filter(function(v){return v}).length;
  var total=Object.keys(courseCheckins).length||1;
  var pct=Math.round(done/total*100);
  document.getElementById('progressBar').style.width=pct+'%';
  document.getElementById('progressRatio').textContent=done+'/'+total;
  document.getElementById('morningCount').textContent=done+'/'+total;
}

/* 底部按钮状态 */
function updateFooterBtn(){
  var btn=document.getElementById('checkinBtn');
  if(!btn)return;
  var hasAny=Object.values(courseCheckins).some(function(v){return v});
  if(hasAny){
    btn.classList.add('checked');
    btn.textContent='✓ 已完成打卡';
  }else{
    btn.classList.remove('checked');
    btn.textContent='打卡提交';
  }
}

/* ===== 事件绑定 ===== */
document.addEventListener('DOMContentLoaded',function(){
  /* 抽屉 */
  var btn=document.getElementById('drawerBtn');
  var overlay=document.getElementById('drawerOverlay');
  var resetBtn=document.getElementById('resetBtn');
  if(btn)btn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();toggleDrawer()});
  if(overlay)overlay.addEventListener('click',function(e){toggleDrawer()});
  if(resetBtn)resetBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();resetToday()});

  /* 底部按钮 */
  var checkinBtn=document.getElementById('checkinBtn');
  var saveBtn=document.getElementById('saveBtn');
  if(checkinBtn)checkinBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();toggleCheckin(4)});
  if(saveBtn)saveBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();showToast('记录已保存')});

  /* 晨间仪式勾选 */
  var weightCheck=document.getElementById('weightCheck');
  var waterCheck=document.getElementById('waterCheck');
  if(weightCheck)weightCheck.addEventListener('click',function(e){e.stopPropagation();toggleMorningCheck(this)});
  if(waterCheck)waterCheck.addEventListener('click',function(e){e.stopPropagation();toggleMorningCheck(this)});

  /* 两级标签切换 */
  document.querySelectorAll('.tag-l1').forEach(function(t){
    t.addEventListener('click',function(e){e.stopPropagation();switchL1(this.getAttribute('data-l1'))});
  });
  document.querySelectorAll('.tag-l2').forEach(function(t){
    t.addEventListener('click',function(e){e.stopPropagation();switchL2(this.getAttribute('data-l2'))});
  });

  /* 第三方APP跳转 */
  var appKeep=document.getElementById('appKeep');
  var appAnt=document.getElementById('appAnt');
  if(appKeep)appKeep.addEventListener('click',function(e){e.stopPropagation();window.location.href='https://m.gotokeep.com/fd-page/shareSportRecord?shareid=6a6b095a1d85d700014c0f47&title_type=group_a&utm_source=wechat'});
  if(appAnt)appAnt.addEventListener('click',function(e){e.stopPropagation();window.location.href='https://u.antaq.com/?scheme=aijk%3A%2F%2Fplatformapi%2Fstartapp%3FappId%3D20002184%26ijk_source%3Dmain_chat_share'});

  /* 初始化 */
  loadCheckins();
  var streak=getStreakDays();
  animateNum(document.getElementById('streakNum'),streak);
  renderCourses();
  updateProgress();
  updateFooterBtn();
});
</script>
