<style>
/* ============================================
   饮食页 - 暖橙 × 薄荷绿点缀
   ============================================ */
:root {
  --mint: #6B9AC4;
  --mint-light: #EBF2F8;
  --orange: #E8915A;
  --orange-light: #FFF3EC;
  --orange-lighter: #FFF8F3;
  --green: #27AE60;
  --green-light: #E8F5E9;
  --red: #D45555;
  --red-light: #FAEBEB;
  --choco: #3D3D3D;
  --choco-light: #8A8A8A;
  --choco-hint: #B0B0B0;
  --border: #E8E8E8;
  --white: #FFFFFF;
  --bg: #FAFAFA;
  --shadow: 0 2px 12px rgba(232, 145, 90, 0.10);
  --shadow-mint: 0 2px 12px rgba(107, 154, 196, 0.10);
  --shadow-float: 0 4px 20px rgba(232, 145, 90, 0.15);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  background: var(--bg);
  color: var(--choco);
  min-height: 100vh;
  max-width: 430px;
  margin: 0 auto;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 140px;
  padding-left: 104px;
}

/* --- 顶部导航栏 --- */
.header {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; padding: 0 16px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
}
.header-back {
  width: 36px; height: 36px; border: none; border-radius: 50%;
  background: var(--orange-light); display: flex; align-items: center; justify-content: center;
  text-decoration: none; color: var(--choco); font-size: 18px; flex-shrink: 0;
}
.header-back:active { transform: scale(0.92); }
.header-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; color: var(--choco); }
.header-drawer {
  width: 36px; height: 36px; border: none; border-radius: 50%;
  background: var(--orange); display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.header-drawer:active { transform: scale(0.92); }
.header-drawer span { display: block; width: 14px; height: 2px; background: var(--white); border-radius: 1px; margin: 1.5px 0; }

/* --- 主体内容 --- */
.main { padding: 16px 16px 0; }

/* --- 通用标题 --- */
.section-title {
  font-size: 15px; font-weight: 600; color: var(--choco);
  margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  padding: 0 4px;
}
.section-title .emoji { font-size: 18px; }

/* ============================================
   第1块：双卡片 - 食谱 / 收藏夹
   ============================================ */
.dual-card-row {
  display: flex; gap: 12px;
  margin-bottom: 16px;
}
.dual-card {
  flex: 1;
  background: var(--white);
  border-radius: 18px;
  padding: 18px 14px;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform 0.15s;
  text-decoration: none;
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  position: relative; overflow: hidden;
}
.dual-card:active { transform: scale(0.96); }
.dual-card.recipe {
  background: linear-gradient(135deg, #FFF3EC, #FFF8F3);
}
.dual-card.fav {
  background: linear-gradient(135deg, #FFF0F0, #FFF8F8);
}
.dual-card-icon {
  width: 48px; height: 48px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; flex-shrink: 0;
}
.dual-card.recipe .dual-card-icon { background: rgba(232, 145, 90, 0.15); }
.dual-card.fav .dual-card-icon { background: rgba(212, 85, 85, 0.12); }
.dual-card-title {
  font-size: 14px; font-weight: 700; color: var(--choco);
  text-align: center;
}
.dual-card-sub {
  font-size: 11px; color: var(--choco-hint);
  text-align: center;
}
.dual-card-arrow {
  position: absolute; top: 12px; right: 12px;
  font-size: 14px; color: var(--choco-hint);
}

/* ============================================
   第2块：周几选择器 + 每日菜单
   ============================================ */
.week-card {
  background: var(--white);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}

/* 周几按钮 */
.week-selector {
  display: flex; gap: 6px;
  overflow-x: auto;
  padding: 2px 0 14px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  margin-bottom: 14px;
}
.week-selector::-webkit-scrollbar { display: none; }
.week-btn {
  flex-shrink: 0;
  width: 48px; height: 56px;
  border-radius: 14px;
  border: 1.5px solid var(--border);
  background: var(--bg);
  font-size: 12px; font-weight: 600;
  color: var(--choco-light);
  cursor: pointer; transition: all 0.2s;
  font-family: inherit;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.week-btn .week-day { font-size: 11px; }
.week-btn .week-date { font-size: 13px; font-weight: 700; }
.week-btn.active {
  background: linear-gradient(135deg, var(--orange), #F0A878);
  color: var(--white);
  border-color: var(--orange);
  box-shadow: 0 2px 10px rgba(232, 145, 90, 0.3);
}
.week-btn.today:not(.active) {
  border-color: var(--orange);
  color: var(--orange);
}
.week-btn:active { transform: scale(0.95); }

/* 餐次区块 */
.meal-section {
  margin-bottom: 14px;
}
.meal-section:last-child { margin-bottom: 0; }
.meal-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px; padding: 0 2px;
}
.meal-icon {
  width: 32px; height: 32px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.meal-breakfast .meal-icon { background: var(--orange-light); }
.meal-lunch .meal-icon { background: var(--mint-light); }
.meal-dinner .meal-icon { background: #F0E6F6; }
.meal-snack .meal-icon { background: var(--green-light); }
.meal-name {
  font-size: 14px; font-weight: 700; color: var(--choco);
}
.meal-time {
  font-size: 11px; color: var(--choco-hint);
  margin-left: auto;
}

/* 食物标签 */
.meal-tags {
  display: flex; flex-wrap: wrap; gap: 8px;
  min-height: 40px;
}
.food-tag {
  display: flex; align-items: center; gap: 4px;
  padding: 8px 14px;
  background: var(--orange-lighter);
  border-radius: 12px;
  font-size: 13px; font-weight: 500;
  color: var(--choco);
  border: 1px solid rgba(232, 145, 90, 0.15);
}
.meal-lunch .food-tag { background: var(--mint-light); border-color: rgba(107, 154, 196, 0.15); }
.meal-dinner .food-tag { background: #F8F0FC; border-color: rgba(150, 100, 180, 0.15); }
.meal-snack .food-tag { background: var(--green-light); border-color: rgba(39, 174, 96, 0.15); }

/* 添加食物按钮 */
.add-food-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 8px 14px;
  border: 1.5px dashed var(--border);
  border-radius: 12px;
  background: transparent;
  font-size: 13px; color: var(--choco-hint);
  cursor: pointer; transition: all 0.2s;
  font-family: inherit;
}
.add-food-btn:active { border-color: var(--orange); color: var(--orange); }
.meal-lunch .add-food-btn:active { border-color: var(--mint); color: var(--mint); }
.meal-dinner .add-food-btn:active { border-color: #9670B4; color: #9670B4; }
.meal-snack .add-food-btn:active { border-color: var(--green); color: var(--green); }

/* 空状态 */
.meal-empty {
  padding: 10px 14px;
  font-size: 12px; color: var(--choco-hint);
  background: var(--bg);
  border-radius: 12px;
  text-align: center;
}

/* 食物标签删除 */
.food-tag .tag-remove {
  display: none;
  margin-left: 2px;
  font-size: 14px;
  color: var(--choco-hint);
  cursor: pointer;
}
.edit-mode .food-tag .tag-remove { display: inline; }
.food-tag .tag-remove:active { color: var(--red); }

/* ============================================
   第3块：我的食谱弹窗
   ============================================ */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.4); z-index: 500;
  opacity: 0; visibility: hidden; transition: all 0.3s;
}
.modal-overlay.open { opacity: 1; visibility: visible; }
.modal {
  position: fixed; bottom: 0; left: 104px; right: 0;
  width: auto; max-width: calc(430px - 104px); margin: 0 auto;
  background: var(--white); border-radius: 24px 24px 0 0;
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 20px));
  z-index: 501; transition: transform 0.35s cubic-bezier(0.32,0.72,0,1);
  transform: translateY(100%);
  max-height: 75vh; overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.modal.open { transform: translateY(0); }
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.modal-title { font-size: 17px; font-weight: 700; color: var(--choco); }
.modal-close {
  width: 30px; height: 30px; border: none; border-radius: 50%;
  background: var(--bg); color: var(--choco-light);
  font-size: 18px; cursor: pointer; line-height: 1;
}

/* 食谱列表 */
.recipe-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.recipe-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px;
  background: var(--orange-lighter);
  border-radius: 14px;
}
.recipe-emoji {
  width: 40px; height: 40px; border-radius: 10px;
  background: var(--orange-light);
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.recipe-info { flex: 1; min-width: 0; }
.recipe-name { font-size: 14px; font-weight: 600; color: var(--choco); margin-bottom: 2px; }
.recipe-desc { font-size: 11px; color: var(--choco-hint); }
.recipe-item .tag-remove {
  width: 24px; height: 24px; border: none; border-radius: 50%;
  background: transparent; color: var(--choco-hint);
  font-size: 16px; cursor: pointer; flex-shrink: 0;
}
.recipe-item .tag-remove:active { color: var(--red); }

/* 添加食谱 */
.add-recipe-row {
  display: flex; gap: 8px;
}
.recipe-input {
  flex: 1; height: 44px;
  border: 1.5px solid var(--border); border-radius: 12px;
  padding: 0 14px; font-size: 14px; font-family: inherit;
  color: var(--choco); outline: none; transition: border 0.2s;
  background: var(--bg);
}
.recipe-input:focus { border-color: var(--orange); background: var(--white); }
.recipe-add-btn {
  width: 44px; height: 44px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, var(--orange), #F0A878);
  color: var(--white); font-size: 20px; cursor: pointer;
  flex-shrink: 0; transition: transform 0.15s;
}
.recipe-add-btn:active { transform: scale(0.92); }

/* ============================================
   添加食物弹窗
   ============================================ */
.add-food-modal {
  padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 20px));
}
.add-food-modal .recipe-list { margin-bottom: 12px; }
.food-suggest {
  font-size: 12px; color: var(--choco-hint);
  margin-bottom: 8px; padding: 0 2px;
}

/* --- 底部操作栏 --- */
.footer {
  position: fixed; bottom: 56px; left: 104px; right: 0; width: auto; max-width: calc(430px - 104px);
  display: flex; gap: 12px;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  z-index: 50;
}
.btn-primary {
  flex: 2; height: 48px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, var(--orange), #F0A878); color: var(--white);
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform 0.15s; font-family: inherit;
  box-shadow: 0 2px 8px rgba(232, 145, 90, 0.25);
}
.btn-primary:active { transform: scale(0.97); }
.btn-primary.checked { background: var(--orange-light); color: var(--choco); border: 1.5px solid var(--orange); }
.btn-secondary {
  flex: 1; height: 48px; border: 1.5px solid var(--orange); border-radius: 14px;
  background: var(--white); color: var(--choco);
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all 0.2s; font-family: inherit;
}
.btn-secondary:active { background: var(--orange-light); transform: scale(0.97); }

/* --- Toast --- */
.toast {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: rgba(61, 61, 61, 0.92); color: #fff;
  padding: 14px 22px; border-radius: 14px;
  font-size: 13px; font-weight: 500;
  z-index: 999; opacity: 0; visibility: hidden;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
}
.toast.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

/* ===== 底部导航栏 ===== */
.bottom-nav { position: fixed; bottom: 0; left: 104px; right: 0; width: auto; max-width: calc(430px - 104px); display: flex; background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid #E8E8E8; z-index: 200; padding-bottom: env(safe-area-inset-bottom, 0); }
.nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 8px 0 10px; cursor: pointer; background: none; border: none; transition: all 0.2s; font-family: inherit; }
.nav-tab:active { transform: scale(0.92); }
.nav-tab svg { width: 24px; height: 24px; color: #B0B0B0; transition: color 0.2s; }
.nav-tab .nav-tab-label { font-size: 11px; color: #B0B0B0; font-weight: 500; transition: color 0.2s; }
.nav-tab.active svg { color: var(--orange); }
.nav-tab.active .nav-tab-label { color: var(--orange); font-weight: 600; }

/* ===== 左侧固定侧边栏 ===== */
.sidebar { position: fixed; top: 0; left: 0; width: 104px; height: 100vh; background: #F5F5F7; z-index: 250; display: flex; flex-direction: column; border-right: 1px solid #E8E8E8; }
.sidebar-header { padding: 14px 10px 10px; border-bottom: 1px solid #ECECEC; flex-shrink: 0; }
.sidebar-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #E8915A 0%, #F0A878 100%); margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.sidebar-name { font-size: 16px; font-weight: 700; color: #3D3D3D; line-height: 1.3; text-align: center; }
.sidebar-menu { flex: 1; overflow-y: auto; padding: 6px 0; -webkit-overflow-scrolling: touch; }
.sidebar-menu::-webkit-scrollbar { display: none; }
.sidebar-item { display: flex; flex-direction: row; align-items: center; gap: 8px; padding: 9px 10px; cursor: pointer; text-decoration: none; color: #8A8A8A; transition: all 0.2s; margin: 2px 6px; border-radius: 10px; }
.sidebar-item:active { transform: scale(0.95); }
.sidebar-item .sb-icon { font-size: 20px; line-height: 1; flex-shrink: 0; }
.sidebar-item .sb-label { font-size: 15px; font-weight: 600; line-height: 1.2; }
.sidebar-item.active { background: rgba(232, 145, 90, 0.15); color: #E8915A; }
.sidebar-item.active .sb-label { font-weight: 700; }
</style>

<script>
/* ============================================
   数据层 - localStorage 持久化
   ============================================ */

/* 我的食谱库 */
function getRecipes() {
  try { return JSON.parse(localStorage.getItem('my_recipes') || '[]'); }
  catch(e) { return []; }
}
function saveRecipes(arr) {
  localStorage.setItem('my_recipes', JSON.stringify(arr));
}

/* 每周餐食计划: { 'mon': { breakfast: [''], lunch: [''], dinner: [''], snack: [''] } } */
function getMealPlan() {
  try { return JSON.parse(localStorage.getItem('meal_plan') || '{}'); }
  catch(e) { return {}; }
}
function saveMealPlan(obj) {
  localStorage.setItem('meal_plan', JSON.stringify(obj));
}

/* 默认食谱数据 */
var defaultRecipes = [
  { emoji: '🥗', name: '牛油果鸡蛋沙拉' },
  { emoji: '🍲', name: '番茄牛腩煲' },
  { emoji: '🍜', name: '日式豚骨拉面' },
  { emoji: '🍣', name: '三文鱼寿司' },
  { emoji: '🥘', name: '韩式部队锅' },
  { emoji: '🍝', name: '奶油蘑菇意面' },
  { emoji: '🥞', name: '松饼早餐' },
  { emoji: '🧇', name: '华夫饼' },
  { emoji: '🍳', name: '番茄炒蛋' },
  { emoji: '🥩', name: '黑椒牛排' },
  { emoji: '🍗', name: '香煎鸡腿排' },
  { emoji: '🥟', name: '手工水饺' },
  { emoji: '粥', name: '皮蛋瘦肉粥' },
  { emoji: '🥤', name: '香蕉牛奶昔' },
  { emoji: '🍵', name: '红豆抹茶' }
];

/* 食物emoji映射 */
var foodEmojiMap = {
  '沙拉': '🥗', '汤': '🍲', '面': '🍜', '寿司': '🍣', '锅': '🥘',
  '意面': '🍝', '饼': '🥞', '蛋': '🍳', '牛排': '🥩', '鸡': '🍗',
  '饺': '🥟', '粥': '🥣', '奶': '🥛', '茶': '🍵', '咖啡': '☕',
  '面包': '🍞', '三明治': '🥪', '饭': '🍚', '水果': '🍎', '酸奶': '🥛'
};
function getFoodEmoji(name) {
  for(var key in foodEmojiMap) {
    if(name.indexOf(key) !== -1) return foodEmojiMap[key];
  }
  return '🍽️';
}

/* 初始化默认食谱 */
if(getRecipes().length === 0) {
  saveRecipes(defaultRecipes);
}

/* ============================================
   周几选择器
   ============================================ */
var weekDays = [
  { key: 'sun', label: '日', full: '周日' },
  { key: 'mon', label: '一', full: '周一' },
  { key: 'tue', label: '二', full: '周二' },
  { key: 'wed', label: '三', full: '周三' },
  { key: 'thu', label: '四', full: '周四' },
  { key: 'fri', label: '五', full: '周五' },
  { key: 'sat', label: '六', full: '周六' }
];

var todayWeekKey = weekDays[new Date().getDay()].key;
var currentWeekKey = todayWeekKey;
var isEditMode = false;

function renderWeekSelector() {
  var container = document.getElementById('weekSelector');
  container.innerHTML = '';
  /* 按周一到周日排序 */
  var ordered = ['mon','tue','wed','thu','fri','sat','sun'];
  ordered.forEach(function(key) {
    var day = weekDays.find(function(d) { return d.key === key; });
    var btn = document.createElement('button');
    btn.className = 'week-btn' + (key === currentWeekKey ? ' active' : '') + (key === todayWeekKey ? ' today' : '');
    btn.innerHTML = '<span class="week-day">周' + day.label + '</span><span class="week-date">' + (key === todayWeekKey ? '今' : day.label) + '</span>';
    btn.addEventListener('click', function() {
      currentWeekKey = key;
      renderWeekSelector();
      renderMeals();
    });
    container.appendChild(btn);
  });
}

/* ============================================
   餐次渲染
   ============================================ */
var mealConfig = [
  { key: 'breakfast', name: '早餐', icon: '🌅', time: '07:00 - 09:00', cls: 'meal-breakfast' },
  { key: 'lunch', name: '午餐', icon: '☀️', time: '11:30 - 13:00', cls: 'meal-lunch' },
  { key: 'dinner', name: '晚餐', icon: '🌙', time: '18:00 - 19:30', cls: 'meal-dinner' },
  { key: 'snack', name: '加餐', icon: '🍵', time: '15:00 / 21:00', cls: 'meal-snack' }
];

function renderMeals() {
  var container = document.getElementById('mealContainer');
  var plan = getMealPlan();
  var dayPlan = plan[currentWeekKey] || {};

  container.innerHTML = '';
  mealConfig.forEach(function(meal) {
    var foods = dayPlan[meal.key] || [];

    var section = document.createElement('div');
    section.className = 'meal-section ' + meal.cls;
    if(isEditMode) section.classList.add('edit-mode');

    var header = document.createElement('div');
    header.className = 'meal-header';
    header.innerHTML = '<div class="meal-icon">' + meal.icon + '</div>' +
      '<div class="meal-name">' + meal.name + '</div>' +
      '<div class="meal-time">' + meal.time + '</div>';
    section.appendChild(header);

    var tagsDiv = document.createElement('div');
    tagsDiv.className = 'meal-tags';

    if(foods.length === 0 && !isEditMode) {
      var empty = document.createElement('div');
      empty.className = 'meal-empty';
      empty.textContent = '暂未安排，点击编辑添加';
      tagsDiv.appendChild(empty);
    } else {
      foods.forEach(function(food, idx) {
        var tag = document.createElement('div');
        tag.className = 'food-tag';
        var emoji = getFoodEmoji(food);
        tag.innerHTML = '<span>' + emoji + ' ' + food + '</span>' +
          '<span class="tag-remove" data-meal="' + meal.key + '" data-idx="' + idx + '">✕</span>';
        tagsDiv.appendChild(tag);
      });
    }

    /* 添加按钮 */
    var addBtn = document.createElement('button');
    addBtn.className = 'add-food-btn';
    addBtn.innerHTML = '+ 添加' + meal.name;
    addBtn.setAttribute('data-meal', meal.key);
    addBtn.setAttribute('data-meal-name', meal.name);
    tagsDiv.appendChild(addBtn);

    section.appendChild(tagsDiv);
    container.appendChild(section);
  });
}

/* ============================================
   删除食物标签
   ============================================ */
document.getElementById('mealContainer').addEventListener('click', function(e) {
  var remove = e.target.closest('.tag-remove');
  if(remove) {
    e.stopPropagation();
    var mealKey = remove.getAttribute('data-meal');
    var idx = parseInt(remove.getAttribute('data-idx'));
    var plan = getMealPlan();
    if(!plan[currentWeekKey]) plan[currentWeekKey] = {};
    if(!plan[currentWeekKey][mealKey]) plan[currentWeekKey][mealKey] = [];
    plan[currentWeekKey][mealKey].splice(idx, 1);
    saveMealPlan(plan);
    renderMeals();
    showToast('已删除');
    return;
  }

  var addBtn = e.target.closest('.add-food-btn');
  if(addBtn) {
    var mealKey = addBtn.getAttribute('data-meal');
    var mealName = addBtn.getAttribute('data-meal-name');
    openFoodModal(mealKey, mealName);
  }
});

/* ============================================
   我的食谱弹窗
   ============================================ */
function openRecipeModal() {
  renderRecipeList();
  document.getElementById('recipeOverlay').classList.add('open');
  document.getElementById('recipeModal').classList.add('open');
}
function closeRecipeModal() {
  document.getElementById('recipeOverlay').classList.remove('open');
  document.getElementById('recipeModal').classList.remove('open');
}

function renderRecipeList() {
  var list = document.getElementById('recipeList');
  var recipes = getRecipes();
  list.innerHTML = '';
  if(recipes.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:20px;color:#B0B0B0;font-size:13px;">还没有菜谱，快添加吧</div>';
    return;
  }
  recipes.forEach(function(r, idx) {
    var item = document.createElement('div');
    item.className = 'recipe-item';
    item.innerHTML = '<div class="recipe-emoji">' + (r.emoji || '🍽️') + '</div>' +
      '<div class="recipe-info"><div class="recipe-name">' + r.name + '</div>' +
      '<div class="recipe-desc">我的菜谱 #' + (idx + 1) + '</div></div>' +
      '<button class="tag-remove" data-idx="' + idx + '">✕</button>';
    list.appendChild(item);
  });
}

document.getElementById('recipeCard').addEventListener('click', openRecipeModal);
document.getElementById('recipeClose').addEventListener('click', closeRecipeModal);
document.getElementById('recipeOverlay').addEventListener('click', closeRecipeModal);

/* 删除食谱 */
document.getElementById('recipeList').addEventListener('click', function(e) {
  var btn = e.target.closest('.tag-remove');
  if(!btn) return;
  var idx = parseInt(btn.getAttribute('data-idx'));
  var recipes = getRecipes();
  recipes.splice(idx, 1);
  saveRecipes(recipes);
  renderRecipeList();
  showToast('已删除菜谱');
});

/* 添加食谱 */
document.getElementById('recipeAddBtn').addEventListener('click', addRecipe);
document.getElementById('recipeInput').addEventListener('keydown', function(e) {
  if(e.key === 'Enter') addRecipe();
});
function addRecipe() {
  var input = document.getElementById('recipeInput');
  var name = input.value.trim();
  if(!name) return;
  var recipes = getRecipes();
  recipes.push({ emoji: getFoodEmoji(name), name: name });
  saveRecipes(recipes);
  input.value = '';
  renderRecipeList();
  showToast('菜谱已添加 🍽️');
}

/* ============================================
   添加食物弹窗
   ============================================ */
var currentMealKey = '';
function openFoodModal(mealKey, mealName) {
  currentMealKey = mealKey;
  document.getElementById('foodModalTitle').textContent = '添加' + mealName;
  renderFoodRecipeList();
  document.getElementById('foodInput').value = '';
  document.getElementById('foodOverlay').classList.add('open');
  document.getElementById('foodModal').classList.add('open');
}
function closeFoodModal() {
  document.getElementById('foodOverlay').classList.remove('open');
  document.getElementById('foodModal').classList.remove('open');
}

function renderFoodRecipeList() {
  var list = document.getElementById('foodRecipeList');
  var recipes = getRecipes();
  list.innerHTML = '';
  if(recipes.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:12px;color:#B0B0B0;font-size:13px;">食谱库为空，请直接输入食物名称</div>';
    return;
  }
  recipes.forEach(function(r) {
    var item = document.createElement('div');
    item.className = 'recipe-item';
    item.style.cursor = 'pointer';
    item.innerHTML = '<div class="recipe-emoji">' + (r.emoji || '🍽️') + '</div>' +
      '<div class="recipe-info"><div class="recipe-name">' + r.name + '</div></div>' +
      '<span style="font-size:18px;color:#E8915A;">+</span>';
    item.addEventListener('click', function() {
      addFoodToMeal(r.name);
    });
    list.appendChild(item);
  });
}

document.getElementById('foodClose').addEventListener('click', closeFoodModal);
document.getElementById('foodOverlay').addEventListener('click', closeFoodModal);

/* 直接输入添加 */
document.getElementById('foodAddBtn').addEventListener('click', function() {
  var input = document.getElementById('foodInput');
  var name = input.value.trim();
  if(!name) return;
  addFoodToMeal(name);
});
document.getElementById('foodInput').addEventListener('keydown', function(e) {
  if(e.key === 'Enter') {
    var name = e.target.value.trim();
    if(name) addFoodToMeal(name);
  }
});

function addFoodToMeal(name) {
  var plan = getMealPlan();
  if(!plan[currentWeekKey]) plan[currentWeekKey] = {};
  if(!plan[currentWeekKey][currentMealKey]) plan[currentWeekKey][currentMealKey] = [];
  if(plan[currentWeekKey][currentMealKey].indexOf(name) !== -1) {
    showToast('已添加过该食物');
    return;
  }
  plan[currentWeekKey][currentMealKey].push(name);
  saveMealPlan(plan);
  closeFoodModal();
  renderMeals();
  showToast('已添加 ' + name);
}

/* ============================================
   编辑模式切换
   ============================================ */
document.getElementById('editBtn').addEventListener('click', function() {
  isEditMode = !isEditMode;
  this.textContent = isEditMode ? '✓ 完成' : '✏️ 编辑';
  renderMeals();
  if(isEditMode) showToast('编辑模式：点✕删除食物');
});

/* ============================================
   打卡逻辑
   ============================================ */
function getTodayKey(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function getCheckinRecords(){try{var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');return d[getTodayKey()]||[]}catch(e){return[]}}
function isChecked(id){return getCheckinRecords().indexOf(id)!==-1}
function submitCheckin(id){var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');var t=getTodayKey();if(!d[t])d[t]=[];if(d[t].indexOf(id)===-1){d[t].push(id);localStorage.setItem('checkin_records',JSON.stringify(d))}updateCheckinButton(true);showToast('打卡成功 🍱')}
function updateCheckinButton(checked){var b=document.getElementById('checkinBtn');if(!b)return;if(checked){b.classList.add('checked');b.textContent='✓ 已完成打卡'}else{b.classList.remove('checked');b.textContent='打卡提交'}}

/* Toast */
function showToast(msg){var e=document.getElementById('appToast');if(e)e.remove();var t=document.createElement('div');t.className='toast';t.id='appToast';t.textContent=msg;document.body.appendChild(t);requestAnimationFrame(function(){t.classList.add('show')});setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove()},300)},1500)}

/* ============================================
   初始化
   ============================================ */
document.addEventListener('DOMContentLoaded', function() {
  renderWeekSelector();
  renderMeals();
  updateCheckinButton(isChecked(2));

  var checkinBtn = document.getElementById('checkinBtn');
  if(checkinBtn) checkinBtn.addEventListener('click', function(e) {
    e.preventDefault(); e.stopPropagation();
    if(!isChecked(2)) { submitCheckin(2); }
    else { showToast('今日已打卡 🍱'); }
  });
});
</script>
