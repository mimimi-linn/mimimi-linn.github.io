<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>📋 待办</title>
<style>
/* ============================================
   待办页 - 薄荷绿 × 暖橙点缀
   联动所有二级页打卡状态
   ============================================ */
:root {
  --mint: #6B9AC4;
  --mint-light: #EBF2F8;
  --mint-lighter: #F5F8FC;
  --orange: #E8915A;
  --orange-light: #FFF3EC;
  --green: #27AE60;
  --green-light: #E8F5E9;
  --red: #D45555;
  --red-light: #FAEBEB;
  --gold: #C9985A;
  --gold-light: #FFF5E6;
  --choco: #3D3D3D;
  --choco-light: #8A8A8A;
  --choco-hint: #B0B0B0;
  --border: #E8E8E8;
  --white: #FFFFFF;
  --bg: #FAFAFA;
  --shadow: 0 2px 12px rgba(107, 154, 196, 0.10);
  --shadow-float: 0 4px 20px rgba(107, 154, 196, 0.15);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  background: var(--bg);
  color: var(--choco);
  min-height: 100vh;
  max-width: 430px;
  margin: 0 auto;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 140px;
  padding-left: 104px;
}

/* --- 顶部导航栏 --- */
.header {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; padding: 0 16px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
}
.header-back {
  width: 36px; height: 36px; border: none; border-radius: 50%;
  background: var(--mint-light); display: flex; align-items: center; justify-content: center;
  text-decoration: none; color: var(--choco); font-size: 18px; flex-shrink: 0;
}
.header-back:active { transform: scale(0.92); }
.header-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; color: var(--choco); }
.header-drawer {
  width: 36px; height: 36px; border: none; border-radius: 50%;
  background: var(--mint); display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.header-drawer:active { transform: scale(0.92); }
.header-drawer span { display: block; width: 14px; height: 2px; background: var(--white); border-radius: 1px; margin: 1.5px 0; }

/* --- 主体内容 --- */
.main { padding: 16px 16px 0; }

/* --- 通用标题 --- */
.section-title {
  font-size: 15px; font-weight: 600; color: var(--choco);
  margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  padding: 0 4px;
}
.section-title .emoji { font-size: 18px; }
.section-title .count-badge {
  margin-left: auto;
  font-size: 12px; font-weight: 700;
  color: var(--mint);
  background: var(--mint-light);
  padding: 3px 10px; border-radius: 10px;
}

/* ============================================
   第1块：今日概览 - 环形进度
   ============================================ */
.overview-card {
  background: linear-gradient(135deg, var(--mint-lighter), var(--white));
  border-radius: 20px;
  padding: 20px 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 20px;
}
.overview-ring {
  position: relative; width: 90px; height: 90px; flex-shrink: 0;
}
.overview-ring svg { transform: rotate(-90deg); }
.overview-ring .ring-bg { fill: none; stroke: var(--border); stroke-width: 7; }
.overview-ring .ring-fg { fill: none; stroke: var(--mint); stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
.overview-ring .ring-text {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  text-align: center;
}
.overview-ring .ring-num { font-size: 22px; font-weight: 700; color: var(--mint); line-height: 1; }
.overview-ring .ring-total { font-size: 11px; color: var(--choco-hint); }
.overview-info { flex: 1; }
.overview-greeting { font-size: 16px; font-weight: 700; color: var(--choco); margin-bottom: 4px; }
.overview-status { font-size: 12px; color: var(--choco-light); line-height: 1.5; }
.overview-status .highlight { color: var(--mint); font-weight: 600; }
.overview-status .pending { color: var(--orange); font-weight: 600; }

/* ============================================
   第2块：每日打卡联动
   ============================================ */
.checkin-card {
  background: var(--white);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.checkin-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
.checkin-item {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 12px 6px;
  border-radius: 14px;
  background: var(--bg);
  cursor: pointer; transition: all 0.2s;
  text-decoration: none; position: relative;
}
.checkin-item:active { transform: scale(0.95); }
.checkin-item.done {
  background: var(--mint-light);
}
.checkin-item.pending {
  background: var(--mint-lighter);
}
.checkin-icon {
  width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.checkin-item.done .checkin-icon { background: rgba(107,154,196,0.2); }
.checkin-item.pending .checkin-icon { background: rgba(107,154,196,0.1); }
.checkin-name { font-size: 11px; font-weight: 600; color: var(--choco); text-align: center; }
.checkin-status {
  font-size: 10px; font-weight: 600;
  padding: 2px 8px; border-radius: 8px;
}
.checkin-item.done .checkin-status { color: var(--mint); background: rgba(107,154,196,0.12); }
.checkin-item.pending .checkin-status { color: var(--mint); background: rgba(107,154,196,0.08); }
.checkin-check {
  position: absolute; top: 6px; right: 6px;
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--mint); color: var(--white);
  display: none; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
}
.checkin-item.done .checkin-check { display: flex; }

/* ============================================
   第3块：自定义待办事项
   ============================================ */
.todo-card {
  background: var(--white);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.todo-input-row {
  display: flex; gap: 8px; margin-bottom: 14px;
}
.todo-input {
  flex: 1; height: 44px;
  border: 1.5px solid var(--border); border-radius: 12px;
  padding: 0 14px; font-size: 14px; font-family: inherit;
  color: var(--choco); outline: none; transition: border 0.2s;
  background: var(--bg);
}
.todo-input:focus { border-color: var(--mint); background: var(--white); }
.todo-add-btn {
  width: 44px; height: 44px; border: none; border-radius: 12px;
  background: linear-gradient(135deg, var(--mint), #8AB5D6);
  color: var(--white); font-size: 20px; cursor: pointer;
  flex-shrink: 0; transition: transform 0.15s;
}
.todo-add-btn:active { transform: scale(0.92); }

.todo-list { display: flex; flex-direction: column; gap: 8px; }
.todo-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px;
  background: var(--mint-lighter);
  border-radius: 12px;
  transition: all 0.2s;
}
.todo-item.done { opacity: 0.55; }
.todo-item.done .todo-text { text-decoration: line-through; color: var(--choco-hint); }
.todo-check {
  width: 22px; height: 22px; border-radius: 7px;
  border: 1.5px solid var(--border); flex-shrink: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; background: var(--white);
}
.todo-check.done { background: var(--mint); border-color: var(--mint); }
.todo-check svg { display: none; width: 14px; height: 14px; color: var(--white); }
.todo-check.done svg { display: block; }
.todo-text { flex: 1; font-size: 14px; color: var(--choco); }
.todo-delete {
  width: 24px; height: 24px; border: none; border-radius: 7px;
  background: transparent; color: var(--choco-hint);
  font-size: 16px; cursor: pointer; flex-shrink: 0; transition: all 0.2s;
}
.todo-delete:active { color: var(--red); }
.todo-empty {
  text-align: center; padding: 20px 0;
  color: var(--choco-hint); font-size: 13px;
}

/* ============================================
   第4块：本周完成趋势
   ============================================ */
.week-card {
  background: var(--white);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.week-chart {
  display: flex; align-items: flex-end; gap: 6px;
  height: 120px; padding-top: 10px;
}
.week-bar-wrap {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.week-bar {
  width: 100%; max-width: 28px; border-radius: 6px 6px 2px 2px;
  background: linear-gradient(to top, var(--mint), #8AB5D6);
  min-height: 4px; transition: height 0.6s ease;
  position: relative;
}
.week-bar.today { background: linear-gradient(to top, var(--orange), #F0A878); }
.week-bar-num {
  position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
  font-size: 10px; font-weight: 700; color: var(--choco);
}
.week-bar-label { font-size: 10px; color: var(--choco-hint); }

/* --- 底部操作栏 --- */
.footer {
  position: fixed; bottom: 56px; left: 104px; right: 0; width: auto; max-width: calc(430px - 104px);
  display: flex; gap: 12px;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  z-index: 50;
}
.btn-primary {
  flex: 2; height: 48px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, var(--mint), #8AB5D6); color: var(--white);
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform 0.15s; font-family: inherit;
  box-shadow: 0 2px 8px rgba(107, 154, 196, 0.25);
}
.btn-primary:active { transform: scale(0.97); }
.btn-primary.checked { background: var(--mint-light); color: var(--choco); border: 1.5px solid var(--mint); }
.btn-secondary {
  flex: 1; height: 48px; border: 1.5px solid var(--mint); border-radius: 14px;
  background: var(--white); color: var(--choco);
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all 0.2s; font-family: inherit;
}
.btn-secondary:active { background: var(--mint-light); transform: scale(0.97); }

/* --- Toast --- */
.toast {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: rgba(61, 61, 61, 0.92); color: #fff;
  padding: 14px 22px; border-radius: 14px;
  font-size: 13px; font-weight: 500;
  z-index: 999; opacity: 0; visibility: hidden;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
}
.toast.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

/* ===== 底部导航栏 ===== */
.bottom-nav { position: fixed; bottom: 0; left: 104px; right: 0; width: auto; max-width: calc(430px - 104px); display: flex; background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid #E8E8E8; z-index: 200; padding-bottom: env(safe-area-inset-bottom, 0); }
.nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 8px 0 10px; cursor: pointer; background: none; border: none; transition: all 0.2s; font-family: inherit; }
.nav-tab:active { transform: scale(0.92); }
.nav-tab svg { width: 24px; height: 24px; color: #B0B0B0; transition: color 0.2s; }
.nav-tab .nav-tab-label { font-size: 11px; color: #B0B0B0; font-weight: 500; transition: color 0.2s; }
.nav-tab.active svg { color: var(--mint); }
.nav-tab.active .nav-tab-label { color: var(--mint); font-weight: 600; }

/* ===== 左侧固定侧边栏 ===== */
.sidebar { position: fixed; top: 0; left: 0; width: 104px; height: 100vh; background: #F5F5F7; z-index: 250; display: flex; flex-direction: column; border-right: 1px solid #E8E8E8; }
.sidebar-header { padding: 14px 10px 10px; border-bottom: 1px solid #ECECEC; flex-shrink: 0; }
.sidebar-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #6B9AC4 0%, #8AB5D6 100%); margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.sidebar-name { font-size: 16px; font-weight: 700; color: #3D3D3D; line-height: 1.3; text-align: center; }
.sidebar-menu { flex: 1; overflow-y: auto; padding: 6px 0; -webkit-overflow-scrolling: touch; }
.sidebar-menu::-webkit-scrollbar { display: none; }
.sidebar-item { display: flex; flex-direction: row; align-items: center; gap: 8px; padding: 9px 10px; cursor: pointer; text-decoration: none; color: #8A8A8A; transition: all 0.2s; margin: 2px 6px; border-radius: 10px; }
.sidebar-item:active { transform: scale(0.95); }
.sidebar-item .sb-icon { font-size: 20px; line-height: 1; flex-shrink: 0; }
.sidebar-item .sb-label { font-size: 15px; font-weight: 600; line-height: 1.2; }
.sidebar-item.active { background: rgba(107, 154, 196, 0.15); color: #6B9AC4; }
.sidebar-item.active .sb-label { font-weight: 700; }
</style>

<script>
/* ============================================
   模块配置 - 与各二级页 checkin id 对应
   ============================================ */
var checkinModules = [
  { id: 1,  name: '阅读', emoji: '📖', page: 'detail-reading.html' },
  { id: 2,  name: '饮食', emoji: '🍱', page: 'detail-eating.html' },
  { id: 4,  name: '运动', emoji: '🏃', page: 'detail-exercise.html' },
  { id: 5,  name: '烘焙', emoji: '🧁', page: 'detail-baking.html' },
  { id: 6,  name: '穿搭', emoji: '👗', page: 'detail-fashion.html' },
  { id: 7,  name: '自媒体', emoji: '📱', page: 'detail-media.html' },
  { id: 8,  name: '摄影', emoji: '📷', page: 'detail-photo.html' },
  { id: 9,  name: '播客', emoji: '🎧', page: 'detail-podcast.html' },
  { id: 10, name: '新闻', emoji: '📰', page: 'detail-news.html' },
  { id: 11, name: '理财', emoji: '💰', page: 'detail-finance.html' },
  { id: 12, name: '复盘', emoji: '🌙', page: 'detail-review.html' }
];
/* 注：id=3 是待办自身，不参与打卡联动 */

/* ============================================
   打卡数据读取（与所有二级页共用 checkin_records）
   ============================================ */
function getTodayKey() {
  var n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth()+1).padStart(2,'0') + '-' + String(n.getDate()).padStart(2,'0');
}
function getCheckinRecords() {
  try { var d = JSON.parse(localStorage.getItem('checkin_records') || '{}'); return d[getTodayKey()] || []; }
  catch(e) { return []; }
}
function isChecked(id) { return getCheckinRecords().indexOf(id) !== -1; }
function toggleCheckin(id) {
  var d = JSON.parse(localStorage.getItem('checkin_records') || '{}');
  var t = getTodayKey();
  if(!d[t]) d[t] = [];
  if(d[t].indexOf(id) === -1) { d[t].push(id); }
  else { d[t] = d[t].filter(function(i) { return i !== id; }); }
  localStorage.setItem('checkin_records', JSON.stringify(d));
}

/* ============================================
   自定义待办事项（localStorage 独立存储）
   ============================================ */
function getTodos() {
  try { return JSON.parse(localStorage.getItem('todo_items_' + getTodayKey()) || '[]'); }
  catch(e) { return []; }
}
function saveTodos(arr) {
  localStorage.setItem('todo_items_' + getTodayKey(), JSON.stringify(arr));
}

/* ============================================
   渲染：今日概览
   ============================================ */
function renderOverview() {
  var records = getCheckinRecords();
  var totalModules = checkinModules.length;
  var doneCount = 0;
  checkinModules.forEach(function(m) {
    if(records.indexOf(m.id) !== -1) doneCount++;
  });

  document.getElementById('overviewDone').textContent = doneCount;
  document.getElementById('overviewTotal').textContent = '/ ' + totalModules;

  /* 环形进度 */
  var circumference = 2 * Math.PI * 38;
  var progress = totalModules > 0 ? doneCount / totalModules : 0;
  var offset = circumference * (1 - progress);
  var ring = document.getElementById('overviewRing');
  ring.setAttribute('stroke-dasharray', circumference);
  ring.setAttribute('stroke-dashoffset', offset);

  /* 状态文案 */
  var greeting = document.getElementById('overviewGreeting');
  var status = document.getElementById('overviewStatus');
  var hour = new Date().getHours();
  var timeGreeting = hour < 6 ? '凌晨好' : hour < 12 ? '早上好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : hour < 22 ? '晚上好' : '夜深了';
  greeting.textContent = timeGreeting + '，今日完成 ' + doneCount + '/' + totalModules;

  var pending = totalModules - doneCount;
  if(doneCount === totalModules) {
    status.innerHTML = '🎉 全部打卡完成，太棒了！';
  } else if(doneCount === 0) {
    status.innerHTML = '今日还没开始打卡，<span class="pending">快去完成吧</span>';
  } else {
    status.innerHTML = '已完成 <span class="highlight">' + doneCount + '</span> 项，还剩 <span class="pending">' + pending + '</span> 项待完成';
  }

  /* 更新badge */
  document.getElementById('checkinBadge').textContent = doneCount + '/' + totalModules;
}

/* ============================================
   渲染：打卡联动网格
   ============================================ */
function renderCheckinGrid() {
  var grid = document.getElementById('checkinGrid');
  var records = getCheckinRecords();
  grid.innerHTML = '';

  checkinModules.forEach(function(m) {
    var done = records.indexOf(m.id) !== -1;
    var item = document.createElement('a');
    item.className = 'checkin-item ' + (done ? 'done' : 'pending');
    item.href = m.page;

    item.innerHTML = '<div class="checkin-check">✓</div>' +
      '<div class="checkin-icon">' + m.emoji + '</div>' +
      '<div class="checkin-name">' + m.name + '</div>' +
      '<div class="checkin-status">' + (done ? '已完成' : '未完成') + '</div>';

    grid.appendChild(item);
  });
}

/* ============================================
   渲染：自定义待办
   ============================================ */
function renderTodos() {
  var list = document.getElementById('todoList');
  var todos = getTodos();
  var activeCount = todos.filter(function(t) { return !t.done; }).length;
  document.getElementById('todoBadge').textContent = activeCount;

  if(todos.length === 0) {
    list.innerHTML = '<div class="todo-empty">暂无待办事项，添加一个吧</div>';
    return;
  }

  list.innerHTML = '';
  todos.forEach(function(t, idx) {
    var item = document.createElement('div');
    item.className = 'todo-item' + (t.done ? ' done' : '');
    item.innerHTML = '<div class="todo-check' + (t.done ? ' done' : '') + '" data-idx="' + idx + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div>' +
      '<div class="todo-text">' + escapeHtml(t.text) + '</div>' +
      '<button class="todo-delete" data-idx="' + idx + '">✕</button>';
    list.appendChild(item);
  });
}

function escapeHtml(text) {
  if(!text) return '';
  var div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

/* 添加待办 */
function addTodo() {
  var input = document.getElementById('todoInput');
  var text = input.value.trim();
  if(!text) return;
  var todos = getTodos();
  todos.push({ text: text, done: false });
  saveTodos(todos);
  input.value = '';
  renderTodos();
  showToast('待办已添加');
}

/* 切换待办完成状态 */
function toggleTodo(idx) {
  var todos = getTodos();
  if(!todos[idx]) return;
  todos[idx].done = !todos[idx].done;
  saveTodos(todos);
  renderTodos();
}

/* 删除待办 */
function deleteTodo(idx) {
  var todos = getTodos();
  todos.splice(idx, 1);
  saveTodos(todos);
  renderTodos();
}

/* 待办列表事件委托 */
document.getElementById('todoList').addEventListener('click', function(e) {
  var check = e.target.closest('.todo-check');
  if(check) {
    toggleTodo(parseInt(check.getAttribute('data-idx')));
    return;
  }
  var del = e.target.closest('.todo-delete');
  if(del) {
    deleteTodo(parseInt(del.getAttribute('data-idx')));
    return;
  }
});

/* 添加按钮 */
document.getElementById('todoAddBtn').addEventListener('click', addTodo);
document.getElementById('todoInput').addEventListener('keydown', function(e) {
  if(e.key === 'Enter') addTodo();
});

/* 清空待办 */
document.getElementById('clearBtn').addEventListener('click', function() {
  var todos = getTodos();
  if(todos.length === 0) { showToast('暂无待办可清空'); return; }
  /* 只清空已完成的 */
  var remaining = todos.filter(function(t) { return !t.done; });
  saveTodos(remaining);
  renderTodos();
  showToast('已清空完成的待办');
});

/* ============================================
   渲染：本周完成趋势
   ============================================ */
function renderWeekChart() {
  var container = document.getElementById('weekChart');
  container.innerHTML = '';

  var today = new Date();
  var dayLabels = ['日','一','二','三','四','五','六'];
  var todayIdx = today.getDay();

  /* 计算最近7天 */
  var maxCount = checkinModules.length;
  for(var i = 6; i >= 0; i--) {
    var d = new Date(today);
    d.setDate(d.getDate() - i);
    var key = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');

    var records;
    try {
      var allData = JSON.parse(localStorage.getItem('checkin_records') || '{}');
      records = allData[key] || [];
    } catch(e) { records = []; }

    /* 统计已打卡模块数 */
    var count = 0;
    checkinModules.forEach(function(m) {
      if(records.indexOf(m.id) !== -1) count++;
    });

    var heightPercent = maxCount > 0 ? (count / maxCount) * 100 : 0;
    var isToday = (i === 0);
    var label = isToday ? '今' : dayLabels[d.getDay()];

    var barWrap = document.createElement('div');
    barWrap.className = 'week-bar-wrap';
    barWrap.innerHTML = '<div class="week-bar' + (isToday ? ' today' : '') + '" style="height:' + Math.max(heightPercent, 3) + '%;">' +
      (count > 0 ? '<span class="week-bar-num">' + count + '</span>' : '') + '</div>' +
      '<span class="week-bar-label">' + label + '</span>';
    container.appendChild(barWrap);
  }
}

/* ============================================
   待办页自身打卡（id=3）
   ============================================ */
function updateCheckinButton() {
  var b = document.getElementById('checkinBtn');
  if(!b) return;
  if(isChecked(3)) {
    b.classList.add('checked');
    b.textContent = '✓ 今日已完成';
  } else {
    b.classList.remove('checked');
    b.textContent = '打卡提交';
  }
}

document.getElementById('checkinBtn').addEventListener('click', function(e) {
  e.preventDefault(); e.stopPropagation();
  if(!isChecked(3)) {
    toggleCheckin(3);
    showToast('打卡成功 📋');
  } else {
    showToast('今日已打卡 📋');
  }
  updateCheckinButton();
  renderOverview();
  renderCheckinGrid();
  renderWeekChart();
});

/* ============================================
   Toast
   ============================================ */
function showToast(msg) {
  var e = document.getElementById('appToast');
  if(e) e.remove();
  var t = document.createElement('div');
  t.className = 'toast'; t.id = 'appToast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(function() { t.classList.add('show'); });
  setTimeout(function() {
    t.classList.remove('show');
    setTimeout(function() { t.remove(); }, 300);
  }, 1500);
}

/* ============================================
   初始化
   ============================================ */
document.addEventListener('DOMContentLoaded', function() {
  renderOverview();
  renderCheckinGrid();
  renderTodos();
  renderWeekChart();
  updateCheckinButton();
});

/* 页面可见性变化时刷新数据（从其他二级页返回时） */
document.addEventListener('visibilitychange', function() {
  if(!document.hidden) {
    renderOverview();
    renderCheckinGrid();
    renderWeekChart();
    updateCheckinButton();
  }
});
</script>
