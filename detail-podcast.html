/* ============================================
   播客页 - 薄荷绿 × 巧克力棕
   ============================================ */
:root {
  --mint: #6B9AC4;
  --mint-light: #EBF2F8;
  --mint-lighter: #FAFAFA;
  --choco: #3D3D3D;
  --choco-light: #8A8A8A;
  --choco-hint: #B0B0B0;
  --border: #E8E8E8;
  --white: #FFFFFF;
  --shadow: 0 2px 12px rgba(107, 154, 196, 0.10);
  --shadow-float: 0 4px 20px rgba(107, 154, 196, 0.15);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  background: var(--mint-lighter);
  color: var(--choco);
  min-height: 100vh;
  max-width: 430px;
  margin: 0 auto;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 140px;
  padding-left: 104px;
}

/* --- 顶部导航栏 --- */
.header {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; padding: 0 16px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
}
.header-back {
  width: 36px; height: 36px; border: none; border-radius: 50%;
  background: var(--mint-light); display: flex; align-items: center; justify-content: center;
  text-decoration: none; color: var(--choco); font-size: 18px; flex-shrink: 0;
}
.header-back:active { transform: scale(0.92); }
.header-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; color: var(--choco); }
.header-drawer {
  width: 36px; height: 36px; border: none; border-radius: 50%;
  background: var(--mint); display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.header-drawer:active { transform: scale(0.92); }
.header-drawer span { display: block; width: 14px; height: 2px; background: var(--white); border-radius: 1px; margin: 1.5px 0; }

/* --- 主体内容 --- */
.main { padding: 16px 16px 0; }

/* --- 通用标题 --- */
.section-title {
  font-size: 15px; font-weight: 600; color: var(--choco);
  margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  padding: 0 4px;
}
.section-title .emoji { font-size: 18px; }

/* ============================================
   播客列表卡片
   ============================================ */
.podcast-card {
  background: var(--white);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.podcast-list {
  display: flex; flex-direction: column; gap: 10px;
}
.podcast-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px;
  background: var(--mint-lighter);
  border-radius: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.podcast-item:active { transform: scale(0.98); }
.podcast-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.podcast-avatar.p1 { background: #E8E0FF; }
.podcast-avatar.p2 { background: #FFE0EC; }
.podcast-avatar.p3 { background: #FFF0E0; }
.podcast-avatar.p4 { background: #E0F0FF; }
.podcast-avatar.p5 { background: #E8F5E9; }
.podcast-avatar.p6 { background: #FFF8E1; }
.podcast-body { flex: 1; min-width: 0; }
.podcast-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 3px;
}
.podcast-name {
  font-size: 14px; font-weight: 600; color: var(--choco);
  display: flex; align-items: center; gap: 5px;
}
.podcast-tag {
  font-size: 9px; font-weight: 500;
  background: var(--mint-light); color: var(--mint);
  padding: 2px 6px; border-radius: 4px;
}
.podcast-jump {
  width: 28px; height: 28px; border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--white);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; cursor: pointer; transition: all 0.2s;
}
.podcast-jump:active { background: var(--mint-light); transform: scale(0.9); }
.podcast-jump svg { width: 12px; height: 12px; color: var(--choco-light); }
.podcast-desc {
  font-size: 11px; color: var(--choco-hint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* --- 平台分区标题 --- */
.platform-title {
  font-size: 13px; font-weight: 700; color: var(--choco);
  margin: 0 4px 10px;
  display: flex; align-items: center; gap: 6px;
}
.platform-title .dot {
  width: 6px; height: 6px; border-radius: 50%;
  flex-shrink: 0;
}
.platform-title .dot.xiaoyuzhou { background: #5B6EE1; }
.platform-title .dot.bilibili { background: #FB7299; }
.platform-title .dot.douyin { background: #1C1C1C; }

/* ============================================
   心得打卡
   ============================================ */
.checkin-card {
  background: var(--white);
  border-radius: 20px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.checkin-title {
  font-size: 15px; font-weight: 600; color: var(--choco);
  margin-bottom: 14px;
  display: flex; align-items: center; gap: 8px;
}
.checkin-title .emoji { font-size: 18px; }
.note-textarea {
  width: 100%; min-height: 100px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 14px;
  font-family: inherit;
  color: var(--choco);
  background: var(--mint-lighter);
  resize: none;
  outline: none;
  line-height: 1.6;
  transition: border 0.2s;
}
.note-textarea:focus { border-color: var(--mint); background: var(--white); }
.note-textarea::placeholder { color: var(--choco-hint); }

/* --- 底部操作栏 --- */
.footer {
  position: fixed; bottom: 56px; left: 104px; right: 0; width: auto; max-width: calc(430px - 104px);
  display: flex; gap: 12px;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  z-index: 50;
}
.btn-primary {
  flex: 2; height: 48px; border: none; border-radius: 14px;
  background: linear-gradient(135deg, #6B9AC4, #8AB5D6); color: var(--white);
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform 0.15s;
}
.btn-primary:active { transform: scale(0.97); }
.btn-primary.checked { background: var(--mint-light); color: var(--choco); border: 1.5px solid var(--mint); }
.btn-secondary {
  flex: 1; height: 48px; border: 1.5px solid var(--mint); border-radius: 14px;
  background: var(--white); color: var(--choco);
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all 0.2s;
}
.btn-secondary:active { background: var(--mint-light); transform: scale(0.97); }

/* --- Toast --- */
.toast {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: rgba(93, 64, 55, 0.9); color: #fff;
  padding: 14px 22px; border-radius: 14px;
  font-size: 13px; font-weight: 500;
  z-index: 999; opacity: 0; visibility: hidden;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
}
.toast.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

/* ===== 底部导航栏 ===== */
.bottom-nav { position: fixed; bottom: 0; left: 104px; right: 0; width: auto; max-width: calc(430px - 104px); display: flex; background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid #E8E8E8; z-index: 200; padding-bottom: env(safe-area-inset-bottom, 0); }
.nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 8px 0 10px; cursor: pointer; background: none; border: none; transition: all 0.2s; font-family: inherit; }
.nav-tab:active { transform: scale(0.92); }
.nav-tab svg { width: 24px; height: 24px; color: #B0B0B0; transition: color 0.2s; }
.nav-tab .nav-tab-label { font-size: 11px; color: #B0B0B0; font-weight: 500; transition: color 0.2s; }
.nav-tab.active svg { color: #6B9AC4; }
.nav-tab.active .nav-tab-label { color: #6B9AC4; font-weight: 600; }

</style>

<script>
/* ============================================
   打卡逻辑 - 与首页共用 localStorage
   ============================================ */
function getTodayKey(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function getCheckinRecords(){try{var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');return d[getTodayKey()]||[]}catch(e){return[]}}
function isChecked(id){return getCheckinRecords().indexOf(id)!==-1}
function submitCheckin(id){var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');var t=getTodayKey();if(!d[t])d[t]=[];if(d[t].indexOf(id)===-1){d[t].push(id);localStorage.setItem('checkin_records',JSON.stringify(d))}updateCheckinButton(true);showToast('打卡成功 🎧')}
function undoCheckin(id){var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');var t=getTodayKey();if(d[t]){d[t]=d[t].filter(function(i){return i!==id});localStorage.setItem('checkin_records',JSON.stringify(d))}updateCheckinButton(false);showToast('已撤销打卡')}
function toggleCheckin(id){if(isChecked(id)){undoCheckin(id)}else{submitCheckin(id)}}
function updateCheckinButton(checked){var b=document.getElementById('checkinBtn');if(!b)return;if(checked){b.classList.add('checked');b.textContent='✓ 已完成打卡'}else{b.classList.remove('checked');b.textContent='打卡提交'}}

/* Toast */
function showToast(msg){var e=document.getElementById('appToast');if(e)e.remove();var t=document.createElement('div');t.className='toast';t.id='appToast';t.textContent=msg;document.body.appendChild(t);requestAnimationFrame(function(){t.classList.add('show')});setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove()},300)},1500)}

/* 事件绑定 */
document.addEventListener('DOMContentLoaded',function(){
  var checkinBtn=document.getElementById('checkinBtn');
  var saveBtn=document.getElementById('saveBtn');

  /* 打卡提交 */
  if(checkinBtn)checkinBtn.addEventListener('click',function(e){
    e.preventDefault();e.stopPropagation();
    var note=document.getElementById('noteInput').value.trim();
    if(!note){showToast('请填写心得内容');return}
    if(!isChecked(9)){submitCheckin(9)}
    else{showToast('今日已打卡 🎧')}
  });

  /* 记录保存 */
  if(saveBtn)saveBtn.addEventListener('click',function(e){
    e.preventDefault();e.stopPropagation();
    var note=document.getElementById('noteInput').value.trim();
    if(!note){showToast('暂无内容可保存');return}
    showToast('记录已保存');
  });

  /* 播客列表点击跳转 */
  document.querySelectorAll('.podcast-item').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      var platform=el.getAttribute('data-platform');
      var url=el.getAttribute('data-url');
      if(!url)return;

      /* 抖音：先尝试唤起App，失败回退网页版 */
      if(platform==='douyin'){
        var secUid=el.getAttribute('data-sec-uid');
        if(secUid){
          var scheme='snssdk1128://user/profile?sec_uid='+secUid;
          var startTime=Date.now();
          var opened=false;

          /* 监听页面隐藏（App成功唤起时页面会隐藏） */
          var visHandler=function(){
            if(document.hidden){opened=true}
          };
          document.addEventListener('visibilitychange',visHandler);

          /* 2.5秒后检测：如果页面仍可见说明App未唤起，回退到网页版 */
          setTimeout(function(){
            document.removeEventListener('visibilitychange',visHandler);
            if(!opened && Date.now()-startTime<3500){
              window.location.href=url;
            }
          },2500);

          /* 尝试唤起抖音App */
          window.location.href=scheme;
          return;
        }
      }

      /* 其他平台直接跳转 */
      window.location.href=url;
    });
  });

  /* 初始化打卡状态 */
  updateCheckinButton(isChecked(9));
});
</script>
