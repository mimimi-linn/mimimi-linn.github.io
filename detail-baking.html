<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧁 烘焙</title>
<meta name="theme-color" content="#7DD3C0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<style>
/* ============================================
   烘焙页 - 薄荷绿×巧克力棕
   ============================================ */
:root {
  --mint: #7DD3C0;
  --mint-light: #E8F5F1;
  --mint-lighter: #F5FBF9;
  --choco: #5D4037;
  --choco-light: #8D7B68;
  --choco-hint: #B5A99A;
  --border: #D4E8E0;
  --white: #FFFFFF;
  --shadow: 0 2px 12px rgba(125, 211, 192, 0.15);
  --shadow-float: 0 4px 20px rgba(125, 211, 192, 0.20);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  background: var(--mint-lighter);
  color: var(--choco);
  min-height: 100vh;
  max-width: 430px;
  margin: 0 auto;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 140px;
 padding-left: 68px;

/* --- 顶部导航栏 --- */
.header {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; padding: 0 16px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
}
.header-back {
  width: 36px; height: 36px; border: none; border-radius: 50%;
  background: var(--mint-light); display: flex; align-items: center; justify-content: center;
  text-decoration: none; color: var(--choco); font-size: 18px; flex-shrink: 0;
}
.header-back:active { transform: scale(0.92); }
.header-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; color: var(--choco); }
.header-drawer {
  width: 36px; height: 36px; border: none; border-radius: 50%;
  background: var(--mint); display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.header-drawer:active { transform: scale(0.92); }
.header-drawer span { display: block; width: 14px; height: 2px; background: var(--white); border-radius: 1px; margin: 1.5px 0; }

/* --- 主体内容 --- */
.main { padding: 16px 16px 0; }

/* --- 卡片 --- */
.card {
  background: var(--white);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.card-title {
  font-size: 15px; font-weight: 600; color: var(--choco);
  margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
}
.card-title .emoji { font-size: 18px; }

/* ============================================
   第1步：小红书账号卡片
   ============================================ */
.xhs-card {
  background: var(--white);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.xhs-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: var(--mint);
}
.xhs-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}
.xhs-avatar {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--mint);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(125, 211, 192, 0.3);
}
.xhs-info { flex: 1; min-width: 0; }
.xhs-name {
  font-size: 17px; font-weight: 700; color: var(--choco);
  margin-bottom: 3px;
  display: flex; align-items: center; gap: 6px;
}
.xhs-name .xhs-tag {
  font-size: 10px; font-weight: 500;
  background: #FF2442; color: #fff;
  padding: 2px 6px; border-radius: 4px;
  letter-spacing: 0.5px;
}
.xhs-id { font-size: 12px; color: var(--choco-hint); }
.xhs-jump-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 2px solid var(--mint);
  background: var(--white);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: all 0.2s;
}
.xhs-jump-btn:active { background: var(--mint-light); transform: scale(0.92); }
.xhs-jump-btn svg { width: 16px; height: 16px; color: var(--mint); }

.xhs-stats {
  display: flex;
  gap: 0;
  padding: 14px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.xhs-stat-item {
  flex: 1; text-align: center;
  position: relative;
}
.xhs-stat-item:not(:last-child)::after {
  content: '';
  position: absolute;
  right: 0; top: 50%;
  transform: translateY(-50%);
  width: 1px; height: 24px;
  background: var(--border);
}
.xhs-stat-num {
  font-size: 24px; font-weight: 700; color: var(--choco);
  line-height: 1.2;
}
.xhs-stat-label {
  font-size: 12px; color: var(--choco-hint);
  margin-top: 4px;
}
.xhs-link-row {
  margin-top: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.xhs-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 24px;
  border-radius: 20px;
  background: var(--mint);
  color: var(--white);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.2s;
}
.xhs-link:active { transform: scale(0.96); opacity: 0.9; }

/* ============================================
   第2步：关注的美食账号
   ============================================ */
.follow-section { margin-bottom: 14px; }
.follow-section-title {
  font-size: 15px; font-weight: 600; color: var(--choco);
  margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  padding: 0 4px;
}
.follow-section-title .emoji { font-size: 18px; }
.follow-card {
  background: var(--white);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: flex-start;
  gap: 12px;
  transition: transform 0.2s;
}
.follow-card:active { transform: scale(0.98); }
.follow-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.follow-avatar.a1 { background: #FFF0E5; }
.follow-avatar.a2 { background: #E5F0FF; }
.follow-body { flex: 1; min-width: 0; }
.follow-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 4px;
}
.follow-name {
  font-size: 15px; font-weight: 600; color: var(--choco);
  display: flex; align-items: center; gap: 5px;
}
.follow-tag {
  font-size: 9px; font-weight: 500;
  background: var(--mint-light); color: var(--mint);
  padding: 2px 5px; border-radius: 4px;
}
.follow-jump {
  width: 28px; height: 28px; border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--white);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; cursor: pointer; transition: all 0.2s;
}
.follow-jump:active { background: var(--mint-light); transform: scale(0.9); }
.follow-jump svg { width: 12px; height: 12px; color: var(--choco-light); }
.follow-desc {
  font-size: 12px; color: var(--choco-hint);
  line-height: 1.5; margin-bottom: 8px;
  overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
}
.follow-latest {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 10px;
  background: var(--mint-lighter);
  border-radius: 10px;
  font-size: 12px; color: var(--choco-light);
}
.follow-latest .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--mint); flex-shrink: 0;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.follow-latest .latest-text {
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.follow-empty {
  text-align: center; padding: 24px 16px;
  color: var(--choco-hint); font-size: 13px;
  background: var(--white); border-radius: 20px;
  box-shadow: var(--shadow);
}

/* ============================================
   第3步：配方留存（飞书文档关联）
   ============================================ */
.recipe-section { margin-bottom: 14px; }
.recipe-section-title {
  font-size: 15px; font-weight: 600; color: var(--choco);
  margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  padding: 0 4px;
}
.recipe-section-title .emoji { font-size: 18px; }
.recipe-card {
  background: var(--white);
  border-radius: 20px;
  padding: 20px;
  box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 14px;
}
.recipe-doc {
  display: flex; align-items: center; gap: 14px;
  padding: 14px;
  background: linear-gradient(135deg, #F0F7FF 0%, #F5FBF9 100%);
  border-radius: 14px;
  border: 1px solid #DDE8F5;
  cursor: pointer;
  transition: transform 0.2s;
}
.recipe-doc:active { transform: scale(0.98); }
.recipe-doc-icon {
  width: 44px; height: 44px; border-radius: 12px;
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  overflow: hidden;
}
.recipe-doc-icon img {
  width: 100%; height: 100%; object-fit: contain;
}
.recipe-doc-body { flex: 1; min-width: 0; }
.recipe-doc-name {
  font-size: 15px; font-weight: 600; color: var(--choco);
  margin-bottom: 3px;
  display: flex; align-items: center; gap: 5px;
}
.recipe-doc-tag {
  font-size: 9px; font-weight: 500;
  background: #3370FF; color: #fff;
  padding: 2px 5px; border-radius: 4px;
}
.recipe-doc-desc {
  font-size: 12px; color: var(--choco-hint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.recipe-doc-arrow {
  width: 32px; height: 32px; border-radius: 50%;
  background: #3370FF;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.recipe-doc-arrow svg { width: 14px; height: 14px; color: #fff; }
.recipe-notice {
  display: flex; align-items: flex-start; gap: 6px;
  font-size: 11px; color: var(--choco-hint);
  line-height: 1.6;
  padding: 0 2px;
}
.recipe-notice .lock-icon { flex-shrink: 0; margin-top: 1px; }

/* ============================================
   第4步：成品记录打卡 + 灵感记录
   ============================================ */
.record-section { margin-bottom: 14px; }
.record-section-title {
  font-size: 15px; font-weight: 600; color: var(--choco);
  margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  padding: 0 4px;
}
.record-section-title .emoji { font-size: 18px; }

/* 打卡区 */
.checkin-row {
  display: flex; flex-direction: column; gap: 12px;
  background: var(--white);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
}
.checkin-top {
  display: flex; align-items: center; gap: 10px;
}
.checkin-top-icon {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.checkin-top-icon img { width: 100%; height: 100%; object-fit: contain; }
.checkin-top-title { font-size: 15px; font-weight: 600; color: var(--choco); }

/* 待办输入行 */
.todo-row {
  display: flex; align-items: center; gap: 10px;
}
.todo-check {
  width: 28px; height: 28px; border-radius: 50%;
  border: 2.5px solid var(--mint);
  background: var(--white);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: all 0.25s ease;
  font-size: 14px; color: transparent;
}
.todo-check:active { transform: scale(0.9); }
.todo-check.done {
  background: #C8C8C8;
  border-color: #C8C8C8;
  color: var(--white);
}
.todo-input {
  flex: 1;
  height: 40px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 0 14px;
  font-size: 14px;
  font-family: inherit;
  color: var(--choco);
  background: var(--mint-lighter);
  outline: none;
  transition: border-color 0.2s;
}
.todo-input:focus { border-color: var(--mint); }
.todo-input::placeholder { color: var(--choco-hint); }
.todo-input.done {
  background: #F5F5F5;
  color: #B5A99A;
  text-decoration: line-through;
}
.checkin-date {
  font-size: 11px; color: var(--mint); font-weight: 500;
}

/* 灵感记录区 */
.inspiration-box {
  background: var(--white);
  border-radius: 20px;
  padding: 16px;
  box-shadow: var(--shadow);
}
.inspiration-input-row {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.inspiration-input {
  flex: 1;
  height: 44px;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 0 14px;
  font-size: 14px;
  font-family: inherit;
  color: var(--choco);
  background: var(--mint-lighter);
  outline: none;
  transition: border-color 0.2s;
}
.inspiration-input:focus { border-color: var(--mint); }
.inspiration-input::placeholder { color: var(--choco-hint); }
.inspiration-save-btn {
  width: 44px; height: 44px; border-radius: 12px;
  border: none;
  background: var(--mint); color: var(--white);
  font-size: 18px; cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s;
}
.inspiration-save-btn:active { transform: scale(0.9); }

/* 灵感列表 */
.inspiration-list-title {
  font-size: 12px; color: var(--choco-hint);
  margin-bottom: 8px; font-weight: 500;
}
.inspiration-list {
  display: flex; flex-direction: column; gap: 8px;
  max-height: 240px; overflow-y: auto;
}
.inspiration-item {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 10px 12px;
  background: var(--mint-lighter);
  border-radius: 12px;
  border-left: 3px solid var(--mint);
}
.inspiration-item-content { flex: 1; min-width: 0; }
.inspiration-item-text {
  font-size: 13px; color: var(--choco); line-height: 1.5;
  word-break: break-word;
}
.inspiration-item-time {
  font-size: 10px; color: var(--choco-hint); margin-top: 4px;
}
.inspiration-item-delete {
  width: 22px; height: 22px; border-radius: 50%;
  border: none; background: transparent;
  color: var(--choco-hint); font-size: 14px;
  cursor: pointer; flex-shrink: 0; line-height: 1;
  display: flex; align-items: center; justify-content: center;
}
.inspiration-item-delete:active { color: #FF6B6B; }
.inspiration-empty {
  text-align: center; padding: 20px 0;
  color: var(--choco-hint); font-size: 13px;
}

/* --- 底部操作栏 --- */
.footer {
  position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px;
  display: flex; gap: 12px;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  z-index: 50;
}
.btn-primary {
  flex: 2; height: 48px; border: none; border-radius: 14px;
  background: var(--mint); color: var(--white);
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: transform 0.15s;
}
.btn-primary:active { transform: scale(0.97); }
.btn-primary.checked { background: var(--mint-light); color: var(--choco); border: 1.5px solid var(--mint); }
.btn-secondary {
  flex: 1; height: 48px; border: 1.5px solid var(--mint); border-radius: 14px;
  background: var(--white); color: var(--choco);
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all 0.2s;
}
.btn-secondary:active { background: var(--mint-light); transform: scale(0.97); }

/* --- Toast --- */
.toast {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: rgba(93, 64, 55, 0.9); color: #fff;
  padding: 14px 22px; border-radius: 14px;
  font-size: 13px; font-weight: 500;
  z-index: 999; opacity: 0; visibility: hidden;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
}
.toast.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

/* --- 右侧抽屉 --- */
.drawer-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.35); z-index: 300; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
.drawer-overlay.open { opacity: 1; visibility: visible; }
.drawer { position: fixed; top: 0; left: -160px; width: 160px; height: 100%; background: var(--white); z-index: 301; transition: left 0.35s cubic-bezier(0.32,0.72,0,1); display: flex; flex-direction: column; box-shadow: 4px 0 24px rgba(0,0,0,0.08); }
.drawer.open { left: 0; }
.drawer-header { padding: 16px 12px 12px; border-bottom: 1px solid var(--border); }
.drawer-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--mint); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; font-size: 28px; }
.drawer-title { font-size: 15px; font-weight: 700; color: var(--choco); margin-bottom: 4px; }
.drawer-subtitle { font-size: 11px; color: var(--choco-hint); }
.drawer-menu { flex: 1; overflow-y: auto; padding: 12px 0; }
.drawer-menu-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; transition: background 0.2s; text-decoration: none; color: var(--choco); font-size: 13px; }
.drawer-menu-item:active { background: var(--mint-light); }
.drawer-menu-item.active { background: var(--mint-light); color: var(--mint); font-weight: 600; }
.drawer-menu-item .menu-emoji { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }
.drawer-menu-item.home-link { border-bottom: 1px solid var(--border); margin-bottom: 8px; color: var(--mint); font-weight: 600; }
.drawer-footer { padding: 12px 12px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 20px) + 56px)); border-top: 1px solid var(--border); }
.drawer-reset-btn { width: 100%; padding: 12px; border-radius: 12px; background: var(--mint-light); border: 1.5px solid var(--mint); color: var(--choco); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
.drawer-reset-btn:active { background: var(--mint); color: #fff; }

/* ===== 底部导航栏 ===== */
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; display: flex; background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid #E8E8E8; z-index: 200; padding-bottom: env(safe-area-inset-bottom, 0); }
.nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 8px 0 10px; cursor: pointer; background: none; border: none; transition: all 0.2s; font-family: inherit; }
.nav-tab:active { transform: scale(0.92); }
.nav-tab svg { width: 24px; height: 24px; color: #B0B0B0; transition: color 0.2s; }
.nav-tab .nav-tab-label { font-size: 11px; color: #B0B0B0; font-weight: 500; transition: color 0.2s; }
.nav-tab.active svg { color: #6B9AC4; }
.nav-tab.active .nav-tab-label { color: #6B9AC4; font-weight: 600; }

/* ===== 左侧固定侧边栏 ===== */
.sidebar { position: fixed; top: 0; left: 0; width: 68px; height: 100vh; background: #F5F5F7; z-index: 250; display: flex; flex-direction: column; border-right: 1px solid #E8E8E8; }
.sidebar-header { padding: 16px 0 12px; text-align: center; border-bottom: 1px solid #ECECEC; flex-shrink: 0; }
.sidebar-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #6B9AC4 0%, #8AB5D6 100%); margin: 0 auto 6px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
.sidebar-name { font-size: 11px; font-weight: 700; color: #3D3D3D; line-height: 1.2; }
.sidebar-menu { flex: 1; overflow-y: auto; padding: 8px 0; -webkit-overflow-scrolling: touch; }
.sidebar-menu::-webkit-scrollbar { display: none; }
.sidebar-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 10px 4px; cursor: pointer; text-decoration: none; color: #8A8A8A; transition: all 0.2s; margin: 2px 6px; border-radius: 12px; }
.sidebar-item:active { transform: scale(0.92); }
.sidebar-item .sb-icon { font-size: 18px; line-height: 1; }
.sidebar-item .sb-label { font-size: 10px; font-weight: 500; line-height: 1.2; }
.sidebar-item.active { background: rgba(107, 154, 196, 0.12); color: #6B9AC4; }

<script>
/* 打卡逻辑 */
function getTodayKey(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function getCheckinRecords(){try{var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');return d[getTodayKey()]||[]}catch(e){return[]}}
function isChecked(id){return getCheckinRecords().indexOf(id)!==-1}
function submitCheckin(id){var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');var t=getTodayKey();if(!d[t])d[t]=[];if(d[t].indexOf(id)===-1){d[t].push(id);localStorage.setItem('checkin_records',JSON.stringify(d))}updateBakingCheckin(true);showToast('打卡成功 🧁 今日烘焙完成！')}
function undoCheckin(id){var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');var t=getTodayKey();if(d[t]){d[t]=d[t].filter(function(i){return i!==id});localStorage.setItem('checkin_records',JSON.stringify(d))}updateBakingCheckin(false);showToast('已撤销打卡')}
function toggleCheckin(id){if(isChecked(id)){undoCheckin(id)}else{submitCheckin(id)}}

/* 更新烘焙打卡按钮状态 */
function updateBakingCheckin(checked){
  var checkBtn=document.getElementById('bakingTodoCheck');
  var inputEl=document.getElementById('bakingTodoInput');
  var dateEl=document.getElementById('checkinDate');
  if(checkBtn){
    if(checked){
      checkBtn.classList.add('done');
    }else{
      checkBtn.classList.remove('done');
    }
  }
  if(inputEl){
    if(checked){
      inputEl.classList.add('done');
    }else{
      inputEl.classList.remove('done');
    }
  }
  if(dateEl){
    if(checked){
      dateEl.textContent='✓ '+getTodayKey()+' 已完成打卡';
    }else{
      dateEl.textContent='';
    }
  }
}

/* 灵感记录逻辑 */
function getInspirations(){try{return JSON.parse(localStorage.getItem('baking_inspirations')||'[]')}catch(e){return[]}}
function saveInspirations(list){localStorage.setItem('baking_inspirations',JSON.stringify(list))}
function addInspiration(text){
  var list=getInspirations();
  var now=new Date();
  var timeStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  list.unshift({id:Date.now(),text:text,time:timeStr});
  saveInspirations(list);
  renderInspirations();
}
function deleteInspiration(id){
  var list=getInspirations().filter(function(i){return i.id!==id});
  saveInspirations(list);
  renderInspirations();
}
function renderInspirations(){
  var list=getInspirations();
  var container=document.getElementById('inspirationList');
  var titleEl=document.getElementById('inspirationListTitle');
  if(!container)return;
  if(list.length===0){
    container.innerHTML='<div class="inspiration-empty">还没有灵感记录，快来记录第一个吧 ✨</div>';
    if(titleEl)titleEl.style.display='none';
    return;
  }
  if(titleEl)titleEl.style.display='block';
  container.innerHTML=list.map(function(item){
    return '<div class="inspiration-item">'+
      '<div class="inspiration-item-content">'+
        '<div class="inspiration-item-text">'+item.text+'</div>'+
        '<div class="inspiration-item-time">'+item.time+'</div>'+
      '</div>'+
      '<button class="inspiration-item-delete" data-id="'+item.id+'" type="button">✕</button>'+
    '</div>';
  }).join('');
  /* 绑定删除事件 */
  container.querySelectorAll('.inspiration-item-delete').forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.preventDefault();e.stopPropagation();
      var id=parseInt(this.getAttribute('data-id'));
      deleteInspiration(id);
      showToast('已删除');
    });
  });
}

/* Toast */
function showToast(msg){var e=document.getElementById('appToast');if(e)e.remove();var t=document.createElement('div');t.className='toast';t.id='appToast';t.textContent=msg;document.body.appendChild(t);requestAnimationFrame(function(){t.classList.add('show')});setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove()},300)},1500)}

/* 抽屉 */
/* 抽屉已移除，使用侧边栏导航 */
function resetToday(){try{localStorage.setItem('checkin_records',JSON.stringify({}))}catch(e){}showToast('今日打卡已重置 🧁')}

/* 事件绑定 */
document.addEventListener('DOMContentLoaded',function(){
  var resetBtn=document.getElementById('resetBtn');
  if(resetBtn)resetBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();resetToday()});

  /* 烘焙打卡 - 圆形待办按钮 */
  var todoCheck=document.getElementById('bakingTodoCheck');
  if(todoCheck)todoCheck.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();toggleCheckin(5)});

  /* 灵感记录保存 */
  var insInput=document.getElementById('inspirationInput');
  var insSaveBtn=document.getElementById('inspirationSaveBtn');
  function saveInspiration(){
    var text=insInput.value.trim();
    if(!text){showToast('请输入灵感内容');return}
    addInspiration(text);
    insInput.value='';
    showToast('灵感已记录 ✨');
  }
  if(insSaveBtn)insSaveBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();saveInspiration()});
  if(insInput)insInput.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();saveInspiration()}});

  /* 小红书跳转 - 显式跳转避免移动端拦截 */
  var xhsUrl='https://xhslink.cn/m/6hJOHOEckM2';
  var xhsBtn=document.getElementById('xhsJumpBtn');
  var xhsLink=document.getElementById('xhsLink');
  function goXHS(e){e.preventDefault();e.stopPropagation();window.location.href=xhsUrl;}
  if(xhsBtn)xhsBtn.addEventListener('click',goXHS);
  if(xhsLink)xhsLink.addEventListener('click',goXHS);

  /* 关注账号跳转 */
  var followBtns=document.querySelectorAll('.follow-jump');
  followBtns.forEach(function(fbtn){
    fbtn.addEventListener('click',function(e){
      e.preventDefault();e.stopPropagation();
      var url=this.getAttribute('data-url');
      if(url){window.location.href=url;}
    });
  });

  /* 飞书配方文档跳转 */
  var recipeDoc=document.getElementById('recipeDoc');
  if(recipeDoc)recipeDoc.addEventListener('click',function(e){
    e.preventDefault();e.stopPropagation();
    window.location.href='https://bg2633jeoj.feishu.cn/wiki/Xt3bwQ8ZqiCbPxkt0x5c9tXunQe?sheet=397db3';
  });

  /* 初始化打卡状态和灵感列表 */
  updateBakingCheckin(isChecked(5));
  renderInspirations();
});
</script>
