<style>
/* ============================================
   烘焙学习页 - 薄荷绿×巧克力棕
   ============================================ */
:root {
  --mint: #7DD3C0;
  --mint-light: #E8F5F1;
  --mint-lighter: #F5FBF9;
  --choco: #5D4037;
  --choco-light: #8D7B68;
  --choco-hint: #B5A99A;
  --border: #D4E8E0;
  --white: #FFFFFF;
  --shadow: 0 2px 12px rgba(125, 211, 192, 0.15);
  --shadow-float: 0 4px 20px rgba(125, 211, 192, 0.20);
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans CJK SC', sans-serif;
  background: var(--mint-lighter);
  color: var(--choco);
  min-height: 100vh;
  max-width: 430px;
  margin: 0 auto;
  -webkit-font-smoothing: antialiased;
  padding-bottom: 90px;
}

/* --- 顶部导航栏 --- */
.header {
  position: sticky; top: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  height: 56px; padding: 0 16px;
  background: var(--white);
  border-bottom: 1px solid var(--border);
}
.header-back {
  width: 36px; height: 36px; border: none; border-radius: 50%;
  background: var(--mint-light); display: flex; align-items: center; justify-content: center;
  text-decoration: none; color: var(--choco); font-size: 18px; flex-shrink: 0;
}
.header-back:active { transform: scale(0.92); }
.header-title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; color: var(--choco); }
.header-drawer {
  width: 36px; height: 36px; border: none; border-radius: 50%;
  background: var(--mint); display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
}
.header-drawer:active { transform: scale(0.92); }
.header-drawer span { display: block; width: 14px; height: 2px; background: var(--white); border-radius: 1px; margin: 1.5px 0; }

/* --- 主体内容 --- */
.main { padding: 16px 16px 0; }

/* --- 卡片 --- */
.card {
  background: var(--white);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.card-title {
  font-size: 15px; font-weight: 600; color: var(--choco);
  margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
}
.card-title .emoji { font-size: 18px; }

/* ============================================
   第1步：小红书账号卡片
   ============================================ */
.xhs-card {
  background: var(--white);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  position: relative;
  overflow: hidden;
}
.xhs-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: var(--mint);
}
.xhs-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
}
.xhs-avatar {
  width: 56px; height: 56px; border-radius: 50%;
  background: var(--mint);
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(125, 211, 192, 0.3);
}
.xhs-info { flex: 1; min-width: 0; }
.xhs-name {
  font-size: 17px; font-weight: 700; color: var(--choco);
  margin-bottom: 3px;
  display: flex; align-items: center; gap: 6px;
}
.xhs-name .xhs-tag {
  font-size: 10px; font-weight: 500;
  background: #FF2442; color: #fff;
  padding: 2px 6px; border-radius: 4px;
  letter-spacing: 0.5px;
}
.xhs-id { font-size: 12px; color: var(--choco-hint); }
.xhs-jump-btn {
  width: 36px; height: 36px; border-radius: 50%;
  border: 2px solid var(--mint);
  background: var(--white);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; flex-shrink: 0;
  transition: all 0.2s;
}
.xhs-jump-btn:active { background: var(--mint-light); transform: scale(0.92); }
.xhs-jump-btn svg { width: 16px; height: 16px; color: var(--mint); }

.xhs-stats {
  display: flex;
  gap: 0;
  padding: 14px 0;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.xhs-stat-item {
  flex: 1; text-align: center;
  position: relative;
}
.xhs-stat-item:not(:last-child)::after {
  content: '';
  position: absolute;
  right: 0; top: 50%;
  transform: translateY(-50%);
  width: 1px; height: 24px;
  background: var(--border);
}
.xhs-stat-num {
  font-size: 24px; font-weight: 700; color: var(--choco);
  line-height: 1.2;
}
.xhs-stat-label {
  font-size: 12px; color: var(--choco-hint);
  margin-top: 4px;
}
.xhs-link-row {
  margin-top: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.xhs-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 24px;
  border-radius: 20px;
  background: var(--mint);
  color: var(--white);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.2s;
}
.xhs-link:active { transform: scale(0.96); opacity: 0.9; }

/* ============================================
   第2步：关注的美食账号
   ============================================ */
.follow-section { margin-bottom: 14px; }
.follow-section-title {

  margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  padding: 0 4px;
}
.follow-section-title .emoji { font-size: 18px; }
.follow-card {

  border-radius: 20px;
  padding: 16px;
  margin-bottom: 10px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: flex-start;
  gap: 12px;
  transition: transform 0.2s;
}
.follow-card:active { transform: scale(0.98); }
.follow-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex-shrink: 0;
}
.follow-avatar.a1 { background: #FFF0E5; }
.follow-avatar.a2 { background: #E5F0FF; }
.follow-body { flex: 1; min-width: 0; }
.follow-top {

}
.follow-name {
  font-size: 15px; font-weight: 600; color: var(--choco);
  display: flex; align-items: center; gap: 5px;
}
.follow-tag {
  font-size: 9px; font-weight: 500;
  background: var(--mint-light); color: var(--mint);
  padding: 2px 5px; border-radius: 4px;
}
.follow-jump {
  width: 28px; height: 28px; border-radius: 50%;
  border: 1.5px solid var(--border);
  background: var(--white);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; cursor: pointer; transition: all 0.2s;
}
.follow-jump:active { background: var(--mint-light); transform: scale(0.9); }
.follow-jump svg { width: 12px; height: 12px; color: var(--choco-light); }
.follow-desc {
  font-size: 12px; color: var(--choco-hint);
  line-height: 1.5; margin-bottom: 8px;
  overflow: hidden; text-overflow: ellipsis;
  display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical;
}
.follow-latest {
  display: flex; align-items: center; gap: 6px;
  padding: 8px 10px;
  background: var(--mint-lighter);
  border-radius: 10px;
  font-size: 12px; color: var(--choco-light);
}
.follow-latest .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--mint); flex-shrink: 0;
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.follow-latest .latest-text {
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.follow-empty {
  text-align: center; padding: 24px 16px;
  color: var(--choco-hint); font-size: 13px;
  background: var(--white); border-radius: 20px;
  box-shadow: var(--shadow);
}

/* --- 底部操作栏 --- */
.footer {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 430px;
  display: flex; gap: 12px;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  z-index: 50;
}
.btn-primary {

  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;

.btn-primary:active { transform: scale(0.97); }
.btn-primary.checked { background: var(--mint-light); color: var(--choco); border: 1.5px solid var(--mint); }
.btn-secondary {
  flex: 1; height: 48px; border: 1.5px solid var(--mint); border-radius: 14px;
  background: var(--white); color: var(--choco);
  font-size: 15px; font-weight: 600; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: all 0.2s;
}
.btn-secondary:active { background: var(--mint-light); transform: scale(0.97); }

/* --- Toast --- */
.toast {
  position: fixed; top: 50%; left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: rgba(93, 64, 55, 0.9); color: #fff;
  padding: 14px 22px; border-radius: 14px;
  font-size: 13px; font-weight: 500;
  z-index: 999; opacity: 0; visibility: hidden;
  transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  white-space: nowrap;
}
.toast.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }

/* --- 右侧抽屉 --- */
.drawer-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.35); z-index: 300; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
.drawer-overlay.open { opacity: 1; visibility: visible; }
.drawer { position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: var(--white); z-index: 301; transition: right 0.35s cubic-bezier(0.32,0.72,0,1); display: flex; flex-direction: column; box-shadow: -4px 0 24px rgba(0,0,0,0.08); }
.drawer.open { right: 0; }
.drawer-header { padding: 24px 20px 16px; border-bottom: 1px solid var(--border); }
.drawer-avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--mint); display: flex; align-items: center; justify-content: center; margin-bottom: 12px; font-size: 28px; }

.drawer-subtitle { font-size: 13px; color: var(--choco-hint); }
.drawer-menu { flex: 1; overflow-y: auto; padding: 12px 0; }
.drawer-menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; cursor: pointer; transition: background 0.2s; text-decoration: none; color: var(--choco); font-size: 15px; }
.drawer-menu-item:active { background: var(--mint-light); }
.drawer-menu-item.active { background: var(--mint-light); color: var(--mint); font-weight: 600; }
.drawer-menu-item .menu-emoji { font-size: 20px; width: 28px; text-align: center; flex-shrink: 0; }
.drawer-menu-item.home-link { border-bottom: 1px solid var(--border); margin-bottom: 8px; color: var(--mint); font-weight: 600; }
.drawer-footer { padding: 16px 20px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 20px)); border-top: 1px solid var(--border); }
.drawer-reset-btn { width: 100%; padding: 12px; border-radius: 12px; background: var(--mint-light); border: 1.5px solid var(--mint); color: var(--choco); font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
.drawer-reset-btn:active { background: var(--mint); color: #fff; }
</style>
</head>

<script>
/* 打卡逻辑 */
function getTodayKey(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function getCheckinRecords(){try{var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');return d[getTodayKey()]||[]}catch(e){return[]}}
function isChecked(id){return getCheckinRecords().indexOf(id)!==-1}
function submitCheckin(id){var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');var t=getTodayKey();if(!d[t])d[t]=[];if(d[t].indexOf(id)===-1){d[t].push(id);localStorage.setItem('checkin_records',JSON.stringify(d))}updateCheckinButton(id,true);showToast('打卡成功 🧁')}
function undoCheckin(id){var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');var t=getTodayKey();if(d[t]){d[t]=d[t].filter(function(i){return i!==id});localStorage.setItem('checkin_records',JSON.stringify(d))}updateCheckinButton(id,false);showToast('已撤销打卡')}
function updateCheckinButton(id,checked){var b=document.getElementById('checkinBtn');if(!b)return;if(checked){b.classList.add('checked');b.textContent='✓ 已完成打卡'}else{b.classList.remove('checked');b.textContent='打卡提交'}}
function toggleCheckin(id){if(isChecked(id)){undoCheckin(id)}else{submitCheckin(id)}}

/* Toast */
function showToast(msg){var e=document.getElementById('appToast');if(e)e.remove();var t=document.createElement('div');t.className='toast';t.id='appToast';t.textContent=msg;document.body.appendChild(t);requestAnimationFrame(function(){t.classList.add('show')});setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove()},300)},1500)}

/* 抽屉 */
function toggleDrawer(){var o=document.getElementById('drawerOverlay'),d=document.getElementById('sideDrawer');var isOpen=d.classList.contains('open');if(isOpen){d.classList.remove('open');o.classList.remove('open');document.body.style.overflow=''}else{d.classList.add('open');o.classList.add('open');document.body.style.overflow='hidden'}}
function resetToday(){try{localStorage.setItem('checkin_records',JSON.stringify({}))}catch(e){}toggleDrawer();showToast('今日打卡已重置 🧁')}

/* 事件绑定 */
document.addEventListener('DOMContentLoaded',function(){
  var btn=document.getElementById('drawerBtn');
  var overlay=document.getElementById('drawerOverlay');
  var resetBtn=document.getElementById('resetBtn');
  var checkinBtn=document.getElementById('checkinBtn');
  var saveBtn=document.getElementById('saveBtn');
  if(btn)btn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();toggleDrawer()});
  if(overlay)overlay.addEventListener('click',function(e){toggleDrawer()});
  if(resetBtn)resetBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();resetToday()});
  if(checkinBtn)checkinBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();toggleCheckin(5)});
  if(saveBtn)saveBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();showToast('记录已保存')});

  /* 小红书跳转 - 显式跳转避免移动端拦截 */
  var xhsUrl='https://xhslink.cn/m/6hJOHOEckM2';
  var xhsBtn=document.getElementById('xhsJumpBtn');
  var xhsLink=document.getElementById('xhsLink');
  function goXHS(e){e.preventDefault();e.stopPropagation();window.location.href=xhsUrl;}
  if(xhsBtn)xhsBtn.addEventListener('click',goXHS);
  if(xhsLink)xhsLink.addEventListener('click',goXHS);

  /* 关注账号跳转 */
  var followBtns=document.querySelectorAll('.follow-jump');
  followBtns.forEach(function(btn){
    btn.addEventListener('click',function(e){
      e.preventDefault();e.stopPropagation();
      var url=this.getAttribute('data-url');
      if(url){window.location.href=url;}
    });
  });
});
updateCheckinButton(5,isChecked(5));
</script>
