/* ============================================
   detail-common.css - H5二级详情页共享样式
   薄荷绿色调 | 375px移动端 | 极简治愈风格
   ============================================ */

/* --- Reset & Base --- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  color: #2d3436;
  background: #FAFAFA;
  -webkit-font-smoothing: antialiased;
 padding-left: 104px; }

/* --- Top Fixed Header --- */
.header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 56px;
  padding: 0 16px;
  background: rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(0, 0, 0, 0.06);
}

.header-back {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: #EBF2F8;
  border-radius: 12px;
  font-size: 18px;
  color: #6B9AC4;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.2s;
}

.header-back:hover {
  background: #EBF2F8;
}

.header-title {
  flex: 1;
  text-align: center;
  font-size: 16px;
  font-weight: 600;
  color: #2d3436;
  letter-spacing: 0.5px;
}

.header-drawer {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: #EBF2F8;
  border-radius: 12px;
  font-size: 16px;
  color: #6B9AC4;
  cursor: pointer;
  transition: background 0.2s;
}

.header-drawer:hover {
  background: #EBF2F8;
}

/* --- Main Content Area --- */
.main {
  padding: 72px 16px 120px;
  max-width: 375px;
  margin: 0 auto;
}

/* --- Card --- */
.card {
  background: #ffffff;
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 16px;
  box-shadow: 0 2px 12px rgba(107, 154, 196, 0.08);
}

.card-title {
  font-size: 15px;
  font-weight: 600;
  color: #2d3436;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.card-title .emoji {
  font-size: 18px;
}

/* --- List Item --- */
.list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  background: #FCFCFC;
  border-radius: 14px;
  margin-bottom: 8px;
  transition: background 0.2s;
}

.list-item:last-child {
  margin-bottom: 0;
}

.list-item-label {
  font-size: 13px;
  color: #2d3436;
  font-weight: 500;
}

.list-item-value {
  font-size: 12px;
  color: #999;
}

/* --- Stat Row --- */
.stat-row {
  display: flex;
  align-items: center;
  justify-content: space-around;
  gap: 12px;
  padding: 8px 0;
}

.stat-item {
  text-align: center;
  flex: 1;
}

.stat-num {
  font-size: 28px;
  font-weight: 700;
  color: #6B9AC4;
  line-height: 1.2;
}

.stat-label {
  font-size: 12px;
  color: #999;
  margin-top: 4px;
}

/* --- Note Textarea --- */
.note-textarea {
  width: 100%;
  min-height: 120px;
  padding: 14px;
  border: 2px solid #EBF2F8;
  border-radius: 14px;
  font-size: 14px;
  color: #2d3436;
  background: #FAFAFA;
  resize: vertical;
  outline: none;
  transition: border-color 0.2s;
  font-family: inherit;
  line-height: 1.6;
}

.note-textarea::placeholder {
  color: #b2bec3;
}

.note-textarea:focus {
  border-color: #6B9AC4;
}

/* --- Info Card (News) --- */
.info-card {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px;
  background: #FCFCFC;
  border-radius: 14px;
  margin-bottom: 10px;
  transition: transform 0.2s;
}

.info-card:last-child {
  margin-bottom: 0;
}

.info-card:active {
  transform: scale(0.98);
}

.info-card-img {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #EBF2F8;
  border-radius: 14px;
  font-size: 22px;
  flex-shrink: 0;
}

.info-card-content {
  flex: 1;
  min-width: 0;
}

.info-card-title {
  font-size: 13px;
  font-weight: 600;
  color: #2d3436;
  line-height: 1.4;
  margin-bottom: 4px;
}

.info-card-source {
  font-size: 11px;
  color: #b2bec3;
}

/* --- Progress Ring --- */
.progress-ring-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 10px 0;
}

.progress-ring {
  transform: rotate(-90deg);
}

.progress-ring-bg {
  fill: none;
  stroke: #EBF2F8;
  stroke-width: 8;
}

.progress-ring-fg {
  fill: none;
  stroke: #6B9AC4;
  stroke-width: 8;
  stroke-linecap: round;
  transition: stroke-dashoffset 1s ease-in-out;
}

.ring-label {
  font-size: 13px;
  color: #999;
  margin-top: 12px;
  text-align: center;
}

/* --- Todo Item --- */
.todo-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  background: #FCFCFC;
  border-radius: 14px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: background 0.2s;
}

.todo-item:last-child {
  margin-bottom: 0;
}

.todo-item:active {
  background: #EBF2F8;
}

.todo-checkbox {
  width: 22px;
  height: 22px;
  border: 2px solid #d0e8dc;
  border-radius: 7px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 12px;
  color: transparent;
  transition: all 0.2s;
  cursor: pointer;
}

.todo-item.done .todo-checkbox {
  background: #6B9AC4;
  border-color: #6B9AC4;
  color: #fff;
}

.todo-text {
  font-size: 13px;
  color: #2d3436;
  line-height: 1.4;
  transition: color 0.2s;
}

.todo-item.done .todo-text {
  color: #b2bec3;
  text-decoration: line-through;
}

/* --- Emoji Mood Selector --- */
.mood-row {
  display: flex;
  align-items: center;
  justify-content: space-around;
  gap: 10px;
  padding: 10px 0;
}

.mood-item {
  width: 48px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  border-radius: 16px;
  border: 2px solid transparent;
  background: #FCFCFC;
  cursor: pointer;
  transition: all 0.25s;
  user-select: none;
}

.mood-item.active {
  border-color: #6B9AC4;
  background: #EBF2F8;
  transform: scale(1.1);
}

/* --- Bottom Fixed Action Bar --- */
.footer {
  position: fixed;
  bottom: 56px;
  left: 104px;
  right: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  padding-bottom: max(12px, env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid rgba(0, 0, 0, 0.06);
  max-width: 375px;
  margin: 0 auto;
}

.btn-primary {
  flex: 1.2;
  height: 48px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #6B9AC4, #8AB5D6);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: opacity 0.2s, transform 0.15s;
  letter-spacing: 1px;
}

.btn-primary:active {
  opacity: 0.85;
  transform: scale(0.97);
}

.btn-primary.checked {
  background: linear-gradient(135deg, #b2bec3, #dfe6e9);

}

.btn-secondary {
  flex: 0.8;
  height: 48px;
  border: 2px solid #6B9AC4;
  border-radius: 16px;
  background: #fff;
  color: #6B9AC4;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s;
  letter-spacing: 1px;
}

.btn-secondary:active {
  background: #FAFAFA;
  transform: scale(0.97);
}

/* --- Toast --- */
.toast {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  padding: 10px 24px;
  background: rgba(107, 154, 196, 0.92);
  color: #fff;
  font-size: 13px;
  font-weight: 500;
  border-radius: 20px;
  z-index: 999;
  opacity: 0;
  pointer-events: none;
  transition: all 0.35s ease;
  white-space: nowrap;
  backdrop-filter: blur(8px);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* --- Income / Expense Stat --- */
.stat-income {

  font-weight: 700;

/* ===== 底部导航栏 ===== */
.bottom-nav { position: fixed; bottom: 0; left: 104px; right: 0; width: auto; max-width: calc(430px - 104px); display: flex; background: rgba(255,255,255,0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid #E8E8E8; z-index: 200; padding-bottom: env(safe-area-inset-bottom, 0); }

  <script>
function getTodayKey(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')}
function getCheckinRecords(){try{var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');return d[getTodayKey()]||[]}catch(e){return[]}}
function isChecked(id){return getCheckinRecords().indexOf(id)!==-1}
function submitCheckin(id){var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');var t=getTodayKey();if(!d[t])d[t]=[];if(d[t].indexOf(id)===-1){d[t].push(id);localStorage.setItem('checkin_records',JSON.stringify(d))}updateCheckinButton(id,true);showToast('打卡成功 🌿')}
function undoCheckin(id){var d=JSON.parse(localStorage.getItem('checkin_records')||'{}');var t=getTodayKey();if(d[t]){d[t]=d[t].filter(function(i){return i!==id});localStorage.setItem('checkin_records',JSON.stringify(d))}updateCheckinButton(id,false);showToast('已撤销打卡')}
function updateCheckinButton(id,checked){var b=document.getElementById('checkinBtn');if(!b)return;if(checked){b.classList.add('checked');b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>已完成打卡'}else{b.classList.remove('checked');b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>打卡提交'}}
function toggleCheckin(id){if(isChecked(id)){undoCheckin(id)}else{submitCheckin(id)}}
function initCheckinState(id){updateCheckinButton(id,isChecked(id))}
function toggleTodo(el){el.classList.toggle('done');var c=el.querySelector('.todo-check');if(c)c.classList.toggle('done')}
/* 抽屉已移除，使用侧边栏导航 */
function resetToday(){try{localStorage.setItem('checkin_records',JSON.stringify({}))}catch(e){}showToast('今日打卡已重置 🌿')}
function showToast(msg,dur){var e=document.getElementById('appToast');if(e)e.remove();var t=document.createElement('div');t.className='toast';t.id='appToast';t.textContent=msg;document.body.appendChild(t);requestAnimationFrame(function(){t.classList.add('show')});setTimeout(function(){t.classList.remove('show');setTimeout(function(){t.remove()},300)},dur||1500)}
function initDrawerEvents(){
  var resetBtn=document.getElementById('resetBtn');
  var checkinBtn=document.getElementById('checkinBtn');
  var saveBtn=document.getElementById('saveBtn');
  if(resetBtn){resetBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();resetToday()});}
  if(checkinBtn){checkinBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();toggleCheckin(11)});}
  if(saveBtn){saveBtn.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();showToast('记录已保存') });}
}
document.addEventListener('DOMContentLoaded',function(){initDrawerEvents()});
initCheckinState(11);
</script>
